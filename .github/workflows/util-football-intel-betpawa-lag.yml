name: 'football-intel: betPawa lag after line-ups'

# D118: does betPawa (Cameroon) follow Pinnacle late in the last 90 minutes before kick-off?
# Spends 5 of the 250 monthly OddsPapi requests; the price histories are free.

on:
  workflow_dispatch:
    inputs:
      since:
        description: 'First kick-off date (UTC)'
        default: '2026-08-01T00:00:00Z'

permissions:
  contents: read

jobs:
  lag:
    if: github.repository == 'benkas418-alt/n8n'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      ODDS_PAPI_KEY: ${{ secrets.ODDS_PAPI_KEY }}
      OUT_DIR: betpawa-lag
      SINCE: ${{ inputs.since }}
    defaults:
      run:
        working-directory: football-intel
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: football-intel

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: football-intel/pyproject.toml

      - name: Install
        run: pip install -q -e .

      - name: Measure
        run: |
          set -o pipefail
          python scripts/betpawa_lag.py | tee lag.log
          { echo '### betPawa lag after line-ups'; echo '```'; sed -n '/Matches with both books/,$p' lag.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: betpawa-lag
          path: football-intel/betpawa-lag
          retention-days: 30
