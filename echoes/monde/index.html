<style>
/* Layout : la carte de la ville à gauche, la table de travail à droite ; une colonne sur téléphone.
   Look unique et sombre, partagé avec le prototype de l'Écho. */
:root {
  color-scheme: dark;
  --night: #15171a; --slab: #1d2024; --slab-2: #262a2f; --rule: #353a41;

  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
[hidden] { display: none !important; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--night); color: var(--chalk); font-family: var(--body); font-size: 14.5px; line-height: 1.5; margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--ochre); outline-offset: 2px; }
.app { max-width: 1240px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px 24px; display: flex; flex-direction: column; gap: 12px; }
header { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; border-bottom: 1px solid var(--rule); padding-bottom: 10px; }
.brand { font-family: var(--display); font-size: 22px; font-weight: 600; letter-spacing: .06em; }
.brand small { font-family: var(--mono); font-size: 11px; color: var(--dust); font-weight: 400; margin-left: 6px; letter-spacing: .04em; }
.clock { font-family: var(--mono); color: var(--ochre); font-size: 15px; font-variant-numeric: tabular-nums; }
.money { font-family: var(--mono); font-size: 13px; color: var(--dust); }
.ctrl { display: flex; gap: 4px; flex-wrap: wrap; margin-left: auto; }
.btn { background: var(--slab-2); border: 1px solid var(--rule); padding: 6px 11px; border-radius: 2px; font-size: 13.5px; }
.btn:hover:not(:disabled) { border-color: var(--dust); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn.on, .btn.primary { background: var(--ochre); color: var(--ochre-ink); border-color: var(--ochre); }
.main { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr); gap: 14px; align-items: start; }
@media (max-width: 900px) { .main { grid-template-columns: minmax(0, 1fr); } }
.mapwrap { background: #101214; border: 1px solid var(--rule); position: relative; }
#map { display: block; width: 100%; height: auto; aspect-ratio: 3 / 2; max-width: 100%; touch-action: manipulation; }
.maphud { display: flex; justify-content: space-between; gap: 8px; padding: 8px 10px; border-top: 1px solid var(--rule); font-size: 13px; flex-wrap: wrap; }
.maphud .muted { font-family: var(--mono); font-size: 12px; }
.side { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.panel { background: var(--slab); border: 1px solid var(--rule); padding: 12px; min-width: 0; }
h3 { font-size: 11.5px; text-transform: uppercase; letter-spacing: .12em; color: var(--dust); margin: 0 0 8px; font-weight: 500; }
h2 { font-family: var(--display); font-weight: 400; font-size: 22px; margin: 0 0 6px; }
p { margin: 0; }
.muted { color: var(--dust); }
.row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.people { display: flex; flex-direction: column; gap: 6px; }
.person { display: flex; justify-content: space-between; align-items: center; gap: 8px; border-top: 1px solid var(--rule); padding-top: 6px; flex-wrap: wrap; }
.person:first-child { border-top: 0; padding-top: 0; }
.person .n { font-family: var(--display); font-size: 16px; }
.person .r { font-size: 12px; color: var(--dust); display: block; }
.tail { font-family: var(--mono); font-size: 12.5px; display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; }
.meter { height: 5px; background: var(--slab-2); position: relative; margin-top: 6px; }
.meter i { position: absolute; inset: 0 auto 0 0; background: var(--ochre); }
.case { border-top: 1px solid var(--rule); padding-top: 8px; margin-top: 8px; }
.case:first-of-type { border-top: 0; margin-top: 0; padding-top: 0; }
.case .t { font-family: var(--display); font-size: 17px; }
.tag { font-family: var(--mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; border: 1px solid var(--rule); padding: 1px 6px; color: var(--dust); }
.notebook { background: var(--paper); color: var(--paper-ink); padding: 12px 14px; max-height: 340px; overflow-y: auto; font-family: var(--display); font-size: 15.5px; }
.notebook .e { border-top: 1px dashed #b9b09b; padding-top: 6px; margin-top: 6px; }
.notebook .e:first-child { border-top: 0; margin-top: 0; padding-top: 0; }
.notebook .m { font-family: var(--mono); font-size: 10.5px; color: #6c6455; text-transform: uppercase; letter-spacing: .04em; }
.notebook .truth { font-family: var(--mono); font-size: 10.5px; color: #8a3b2e; }
.msgs { display: flex; flex-direction: column; gap: 8px; max-height: 220px; overflow-y: auto; }
.msg { font-size: 13.5px; border-left: 2px solid var(--rule); padding-left: 8px; }
.msg.new { border-left-color: var(--ochre); }
.msg .m { font-family: var(--mono); font-size: 11px; color: var(--dust); }
.author { border-color: #6b4f2a; }
.author .log { font-family: var(--mono); font-size: 11.5px; max-height: 240px; overflow-y: auto; display: flex; flex-direction: column; gap: 3px; }
.modal-back { position: fixed; inset: 0; background: rgba(8, 9, 10, .72); z-index: 40; display: flex; align-items: center; justify-content: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.modal { background: var(--slab); border: 1px solid var(--rule); max-width: 560px; width: 100%; max-height: 100%; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.modal .quote { font-family: var(--display); font-size: 18px; line-height: 1.5; }
.modal .kind { font-family: var(--mono); font-size: 11px; color: var(--dust); }
.choices { display: flex; flex-direction: column; gap: 6px; }
.choices button { text-align: left; background: var(--slab-2); border: 1px solid var(--rule); padding: 9px 12px; }
.choices button:hover:not(:disabled) { border-color: var(--ochre); }
.choices button:disabled { opacity: .45; cursor: not-allowed; }
.opts label { display: flex; gap: 8px; align-items: flex-start; padding: 4px 0; }
.opts input { accent-color: var(--ochre); margin-top: 4px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--paper); color: var(--paper-ink); padding: 9px 14px; font-size: 14px; max-width: min(520px, calc(100% - 32px)); z-index: 60; box-shadow: 0 6px 24px rgba(0,0,0,.5); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

      <div class="panel author" id="p-author" hidden>
        <h3>Vue auteur · vérité objective</h3>
        <div id="facts" style="font-size:13px;margin-bottom:8px"></div>
        <h3>Journal du monde</h3>
        <div class="log" id="wlog"></div>
      </div>
    </div>
  </div>
</div>
<div class="modal-back" id="modal" hidden><div class="modal" id="modal-body" role="dialog" aria-modal="true"></div></div>

<!-- ======================= MOTEUR ======================= -->
<script>
"use strict";
const W = window.WORLD;
const SAVE_VERSION = 1;
const DOW = ['lun.', 'mar.', 'mer.', 'jeu.', 'ven.', 'sam.', 'dim.'];
const SPEED = 12; // pixels par minute de jeu, à pied
const $ = id => document.getElementById(id);
let G = null;

/* ---------- Core : état et horloge ---------- */
function newGame() {
  G = { v: SAVE_VERSION, dataVersion: W.dataVersion, t: 8 * 60, money: 300,
    player: { x: W.places.cabinet.x, y: W.places.cabinet.y, path: [] },
    away: null, npcs: {}, rel: {}, facts: {}, flags: {}, cases: {}, knowledge: [], messages: [], log: [], done: {}, seen: {}, tail: null, author: false, seq: 0 };
  for (const [id, n] of Object.entries(W.npcs)) {
    const p = W.places[n.home];
    G.npcs[id] = { home: n.home, sched: 'base', specials: JSON.parse(JSON.stringify(n.specials || [])), x: p.x, y: p.y, path: [], dest: n.home, wary: 0 };
  }
  for (const [a, b, trust, aff, ten, vis] of W.relations) G.rel[a + '>' + b] = { trust, affection: aff, tension: ten, visibility: vis };
  note('Lundi matin, au cabinet. Ben fait le café. Ima trie le courrier. Rien sur le bureau.');
  runThreads();
}
const day = (t = G.t) => Math.floor(t / 1440) + 1;
const hour = (t = G.t) => (t % 1440) / 60;
const dow = (t = G.t) => (day(t) - 1) % 7;
const fmtT = t => DOW[dow(t)] + ' ' + day(t) + ' · ' + String(Math.floor(hour(t))).padStart(2, '0') + ':' + String(Math.floor(t % 60)).padStart(2, '0');
function wlog(text) { G.log.push({ t: G.t, text }); }
function note(text, extra) { G.knowledge.push(Object.assign({ id: ++G.seq, t: G.t, kind: 'note', text }, extra || {})); }

/* ---------- WorldSystem : quartiers, lieux, foule ---------- */
function districtAt(x, y) {
  for (const d of W.districts) { const [rx, ry, rw, rh] = d.rect; if (x >= rx && x < rx + rw && y >= ry && y < ry + rh) return d; }
  return { id: 'rail', name: 'Corridor ferroviaire' };
}
function crowd(x, y, t = G.t) { const d = districtAt(x, y); return W.crowd[d.id] ? W.crowd[d.id](hour(t)) : 0.2; }
function placeAt(x, y, r = 28) { for (const [id, p] of Object.entries(W.places)) if (Math.hypot(p.x - x, p.y - y) < r) return id; return null; }
// Trois-Ponts ne touche le reste de la ville que par ses trois ponts.
function route(x, y, tx, ty) {
  const left = v => v < 270;
  if (left(x) === left(tx)) return [[tx, ty]];
  const by = W.bridges.reduce((b, c) => (Math.abs(c - (y + ty) / 2) < Math.abs(b - (y + ty) / 2) ? c : b));
  return left(x) ? [[255, by], [305, by], [tx, ty]] : [[305, by], [255, by], [tx, ty]];
}
function stepAlong(o, dist) {
  while (dist > 0 && o.path.length) {
    const [tx, ty] = o.path[0]; const d = Math.hypot(tx - o.x, ty - o.y);
    if (d <= dist) { o.x = tx; o.y = ty; o.path.shift(); dist -= d; } else { o.x += (tx - o.x) / d * dist; o.y += (ty - o.y) / d * dist; dist = 0; }
  }
}

/* ---------- ScheduleSystem ---------- */
function scheduledPlace(id, t = G.t) {
  const n = W.npcs[id], s = G.npcs[id], h = hour(t), d = dow(t), dd = day(t);
  for (const sc of W.scenes) if (sc.who.includes(id) && sc.day === dd && h >= sc.from && h < sc.to && conds(sc.cond)) return sc.loc;
  for (const sp of s.specials) {
    if (!sp.dows.includes(d)) continue;
    if (sp.optional && s.wary >= dd) continue;
    for (const [a, b, loc] of sp.blocks) if (h >= a && h < b) return loc === 'home' ? s.home : loc;
  }
  const sch = n.schedules[s.sched] || n.schedules.base;
  const blocks = d === 5 ? (sch.sat || sch.wk) : d === 6 ? (sch.sun || sch.wk) : sch.wk;
  let loc = blocks[0][1];
  for (const [a, l] of blocks) if (h >= a) loc = l;
  return loc === 'home' ? s.home : loc;
}

/* ---------- NPCSystem : niveaux de simulation ---------- */
// Niveau 1-2 (joueur en ville) : chaque minute, déplacement réel. Niveau 3 (joueur absent) : placement direct.
function tickNPCs() {
  for (const id of Object.keys(G.npcs)) {
    const s = G.npcs[id], dest = scheduledPlace(id);
    if (dest !== s.dest) { s.dest = dest; const p = W.places[dest]; s.path = route(s.x, s.y, p.x, p.y); }
    stepAlong(s, SPEED);
  }
}
function snapNPCs() {
  for (const id of Object.keys(G.npcs)) { const s = G.npcs[id]; s.dest = scheduledPlace(id); const p = W.places[s.dest]; s.x = p.x; s.y = p.y; s.path = []; }
}

/* ---------- RelationshipSystem ---------- */
function relAdd(a, b, d) {
  const k = a + '>' + b; const r = G.rel[k] || (G.rel[k] = { trust: 0, affection: 0, tension: 0, visibility: 'privée' });
  const c = v => Math.max(-100, Math.min(100, v));
  r.trust = c(r.trust + d[0]); r.affection = c(r.affection + d[1]); r.tension = c(r.tension + d[2]);
}

/* ---------- Conditions et effets (contenu → moteur) ---------- */
function playerKnows(f) { return G.knowledge.some(k => k.fact === f); }
function conds(list) {
  if (!list) return true;
  return list.every(c => {
    if (c.fact) return !!G.facts[c.fact];
    if (c.flag) return !!G.flags[c.flag];
    if (c.notFlag) return !G.flags[c.notFlag];
    if (c.knows) return playerKnows(c.knows);
    if (c.money) return G.money >= c.money;
    if (c.notWary) return G.npcs[c.notWary].wary < day();
    if (c.caseStatus) return (G.cases[c.caseStatus[0]] || {}).status === c.caseStatus[1];
    return true;
  });
}
function apply(effects) {
  for (const e of effects || []) {
    if (e.fact) { if (!G.facts[e.fact]) { G.facts[e.fact] = G.t; } }
    if (e.knows) { (G.npcs[e.knows].knows = G.npcs[e.knows].knows || []).push(e.f); }
    if (e.rel) relAdd(e.rel[0], e.rel[1], e.d);
    if (e.home) { G.npcs[e.home[0]].home = e.home[1]; }
    if (e.sched) G.npcs[e.sched[0]].sched = e.sched[1];
    if (e.clearSpecial) { const s = G.npcs[e.clearSpecial[0]]; s.specials = s.specials.filter(x => x.tag !== e.clearSpecial[1]); }
    if (e.flag) G.flags[e.flag] = true;
    if (e.money) G.money += e.money;
    if (e.log) wlog(e.log);
    if (e.note) note(e.note);
    if (e.caseStatus) { const c = G.cases[e.caseStatus[0]] || (G.cases[e.caseStatus[0]] = {}); c.status = e.caseStatus[1]; c.since = G.t; }
    if (e.msg && conds(e.cond)) G.messages.push({ id: ++G.seq, t: G.t, channel: e.msg, district: e.district, text: e.text, delivered: false, read: false });
  }
}

/* ---------- EventSystem : fils, scènes, événements à choix ---------- */
function runThreads() {
  for (const th of W.threads) {
    if (G.done['th:' + th.id]) continue;
    if (G.t < ((th.day - 1) * 1440 + th.hour * 60)) continue;
    G.done['th:' + th.id] = true;
    if (conds(th.cond)) apply(th.effects);
  }
}
function atPlace(loc, r = 32) { const p = W.places[loc]; return !G.away && Math.hypot(G.player.x - p.x, G.player.y - p.y) < r; }
function runEvents() {
  for (const ev of W.events) {
    if (G.done['ev:' + ev.id]) continue;
    if (ev.requires && !G.flags[ev.requires]) continue;
    const start = (ev.day - 1) * 1440 + ev.from * 60, end = (ev.day - 1) * 1440 + ev.to * 60;
    if (G.t < start) continue;
    if (G.t <= end && atPlace(ev.loc)) { G.done['ev:' + ev.id] = true; showEvent(ev); return; }
    if (G.t > end) { G.done['ev:' + ev.id] = true; apply(ev.absent); wlog('Événement manqué : ' + ev.title + '.'); }
  }
}

/* ---------- InvestigationSystem : observations et filature ---------- */
function visible(id) {
  if (G.away) return false;
  const s = G.npcs[id];
  if (G.author) return true;
  if (G.tail && G.tail.target === id && G.tail.state === 'filature') return true;
  return districtAt(s.x, s.y).id === districtAt(G.player.x, G.player.y).id || Math.hypot(s.x - G.player.x, s.y - G.player.y) < 130;
}
function observe() {
  if (G.away) return;
  const near = (x, y, r) => Math.hypot(G.player.x - x, G.player.y - y) < r;
  for (const sc of W.scenes) {
    if (G.seen['sc:' + sc.id]) continue;
    const h = hour(), p = W.places[sc.loc];
    if (sc.day !== day() || h < sc.from || h >= sc.to || !conds(sc.cond) || !near(p.x, p.y, 120)) continue;
    const present = sc.who.filter(id => Math.hypot(G.npcs[id].x - p.x, G.npcs[id].y - p.y) < 20);
    if (present.length < Math.min(2, sc.who.length)) continue;
    G.seen['sc:' + sc.id] = true;
    addEvidence({ kind: 'observation', fact: sc.fact, text: sc.text, where: p.name, related: present, reliability: 'vu', truth: 'vrai' });
    if (sc.opensCase && !G.cases[sc.opensCase]) openFoundCase(sc.opensCase, 'Vous étiez sur le parvis.');
  }
  for (const ob of W.observables) {
    const key = 'ob:' + ob.npc + ':' + ob.loc + ':' + day();
    if (G.seen[key] || !conds(ob.cond)) continue;
    const s = G.npcs[ob.npc], p = W.places[ob.loc];
    if (Math.hypot(s.x - p.x, s.y - p.y) < 10 && near(p.x, p.y, 155)) { // on voit une porte depuis l'autre côté de la rue
      G.seen[key] = true;
      if (!G.knowledge.some(k => k.text === ob.text)) addEvidence({ kind: 'observation', fact: ob.fact, text: ob.text, where: p.name, related: [ob.npc], reliability: 'vu', truth: 'vrai' });
    }
  }
}
function openFoundCase(id, how) {
  G.cases[id] = { status: 'ouvert', since: G.t, found: true }; G.flags['case_' + id] = true;
  note('Nouvelle piste, sans client : ' + W.cases[id].title + '. ' + how);
  toast('Nouvelle piste : ' + W.cases[id].title);
}
function addEvidence(e) {
  const k = Object.assign({ id: ++G.seq, t: G.t, origin: G.away ? G.away.place : 'South City' }, e);
  G.knowledge.push(k);
  toast('Au carnet : ' + (e.kind === 'observation' ? 'observation' : 'témoignage'));
  return k;
}
const TAIL_DIST = { proche: 40, moyenne: 85, loin: 140 };
function startTail(id) {

  wlog('Le joueur commence à suivre ' + W.npcs[id].name + '.');
  render();
}
function tickTail() {
  const T = G.tail; if (!T || T.state !== 'filature') return;
  const s = G.npcs[T.target], p = G.player;
  const want = TAIL_DIST[T.dist]; const d = Math.hypot(s.x - p.x, s.y - p.y);
  if (d > want) { p.path = [[s.x, s.y]]; stepAlong(p, Math.min(SPEED * 1.15, d - want)); }
  const c = crowd(p.x, p.y), dd = Math.hypot(s.x - p.x, s.y - p.y);
  // Le soupçon dépend de la distance ET de la foule : on se cache dans la foule, pas dans le vide.
  if (dd < 60) T.suspicion += 1 + 6 * (1 - c); else if (dd < 110) T.suspicion += 2.2 * (1 - c); else T.suspicion -= 1;
  if (s.path.length === 0) T.suspicion -= 0.5;
  T.suspicion = Math.max(0, Math.min(100, T.suspicion));
  if (T.suspicion >= 100) {
    T.state = 'repéré'; s.wary = day() + 2; relAdd(T.target, 'player', [-25, 0, 30]);
    wlog(W.npcs[T.target].name + ' a repéré le détective. Il change ses habitudes pour deux jours.');
    note(W.npcs[T.target].short + ' vous a repéré. Il va se méfier quelques jours.');
    toast('Repéré.');
  } else if (dd > 125 && c > 0.6 && Math.random() < 0.06) {
    T.state = 'perdue'; wlog('Le joueur perd ' + W.npcs[T.target].name + ' dans la foule.'); toast('Cible perdue dans la foule. Vos observations restent au carnet.');
  }
}

/* ---------- DialogueSystem ---------- */
function topicsFor(id) {
  const lines = W.dialogue[id] || []; const seen = new Set(); const out = [];
  for (const l of lines) { if (seen.has(l.topic)) continue; const first = lines.find(x => x.topic === l.topic && conds(x.when)); if (first) { seen.add(l.topic); out.push(first); } }
  return out;
}
function ask(id, line) {
  const n = W.npcs[id];

  apply(line.effects);
  const truthKind = line.kind;
  if (line.yields) {
    if (!G.knowledge.some(k => k.text === line.text)) addEvidence({ kind: 'témoignage', fact: W.facts[line.yields] ? line.yields : null, text: n.short + ' : ' + line.text, where: placeName(), related: [id], reliability: 'déclaré', prov: line.prov || 'légitime', truth: truthKind });
  } else if (!G.knowledge.some(k => k.text === n.short + ' : ' + line.text)) {
    G.knowledge.push({ id: ++G.seq, t: G.t, kind: 'témoignage', text: n.short + ' : ' + line.text, related: [id], reliability: 'déclaré', truth: truthKind });
  }
  G.t += 10; // un entretien prend du temps
  showModal(n.name, '<p class="quote"></p><p class="kind"></p>', m => {
    m.querySelector('.quote').textContent = line.text;
    m.querySelector('.kind').textContent = G.author ? '[vue auteur] ' + truthKind : 'Ce qui est dit n’est pas forcément vrai.';
  }, [{ label: 'Continuer', act: () => talk(id) }, { label: 'Partir', act: closeModal }]);
}
function talk(id) {
  const n = W.npcs[id], tops = topicsFor(id);
  showModal(n.name, '<p class="muted"></p>', m => { m.querySelector('p').textContent = n.role + '. Besoin dominant : ' + (G.author ? n.need : 'à vous de le lire') + '.'; },
    tops.map(l => ({ label: l.label + (l.cost ? ' (' + l.cost + ' cr.)' : ''), act: () => ask(id, l), disabled: l.cost && G.money < l.cost }))
      .concat([{ label: 'Partir', act: closeModal }]));
}

/* ---------- Rapports et conclusions ---------- */
function openReport(caseId) {
  const R = W.reports[caseId];
  const opts = R.options.map(o => ({ label: o.label + (o.needs && !o.needs.every(playerKnows) ? ' (il vous manque une preuve)' : ''), disabled: o.needs && !o.needs.every(playerKnows), act: () => conclude(caseId, o) }));
  showModal('Rapport · ' + W.cases[caseId].title, '<p class="muted">Ce que vous écrivez aura des conséquences. Le monde ne vous dira pas tout de suite si vous aviez raison.</p>' +
    (R.extra ? '<div class="opts"><label><input type="checkbox" id="rep-extra"' + (R.extra.needs.every(playerKnows) ? '' : ' disabled') + '><span></span></label></div>' : ''), m => {

}

/* ---------- TravelSystem : vacances ---------- */

function travel(dur, mode) {
  G.tail = null; save(true);

  wlog('Le joueur part ' + dur + ' jours à ' + W.vacation.place + '.');
  const startMsg = G.messages.length;
  // Niveau 3 : simulation simplifiée, par pas de 30 minutes. Les fils et les événements avancent ; personne n'est observé.
  while (G.t < until) { G.t += 30; runThreads(); runEvents(); }
  const calls = G.messages.slice(startMsg).filter(m => m.channel === 'telephone');
  const lines = ['Jour ' + day(leave) + ' : route vers ' + W.vacation.place + '. Hôtel face à la mer.'];
  if (mode === 'limite') for (const c of calls) { c.delivered = true; lines.push('Appel pendant le séjour, ' + fmtT(c.t) + '. ' + c.text); }
  else if (calls.length) lines.push('Votre téléphone est resté éteint.');
  G.away = null; G.player.x = W.places.cabinet.x; G.player.y = W.places.cabinet.y; G.player.path = [];
  snapNPCs();
  lines.push('Retour à South City, ' + fmtT(G.t) + '.');
  const V = W.vacation.event;
  showModal(W.vacation.place + ' · ' + dur + ' jours', '<div id="vlog" style="display:flex;flex-direction:column;gap:6px"></div>' + (mode === 'limite' ? '' : ''), m => {
    const box = m.querySelector('#vlog');
    for (const l of lines) { const p = document.createElement('p'); p.textContent = l; box.appendChild(p); }
    const p = document.createElement('p'); p.className = 'quote'; p.textContent = V.title + ' — ' + V.text; box.appendChild(p);
  }, [{ label: 'Aider cet homme', act: () => { G.money += 40; note('Port-Lys : ' + V.help); finishReturn(); } }, { label: 'Ne pas s’en mêler', act: () => { note('Port-Lys : ' + V.skip); finishReturn(); } }]);
}
function finishReturn() {
  closeModal();
  const pending = G.messages.filter(m => !m.delivered).length;
  note('De retour au cabinet. ' + (pending ? 'Des choses ont bougé : lisez vos messages, faites le tour.' : 'Rien sur le répondeur.'));
  deliver(); render();
}

/* ---------- Messages : livrés seulement par un canal crédible ---------- */
function deliver() {
  if (G.away) return;
  const here = districtAt(G.player.x, G.player.y).id;
  for (const m of G.messages) {
    if (m.delivered) continue;
    if (m.channel === 'journal' && hour() >= 7) m.delivered = true;
    if (m.channel === 'telephone') m.delivered = true;
    if (m.channel === 'cabinet' && atPlace('cabinet', 40)) m.delivered = true;
    if (m.channel === 'rumeur' && m.district === here) m.delivered = true;
    if (m.delivered) { m.at = G.t; toast('Nouveau message'); }
  }
}

/* ---------- SaveSystem : versionné, avec migration ---------- */
const SAVE_KEY = 'btt-southcity-save';
function save(quiet) {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(Object.assign({}, G, { savedAt: Date.now() }))); if (!quiet) toast('Partie sauvegardée.'); }
  catch (e) { if (!quiet) toast('Sauvegarde impossible dans ce navigateur.'); }
}
function migrate(s) {
  // v1 est la première version. Les futures versions ajouteront ici leurs conversions, dans l'ordre.
  if (!s.v) s.v = 1;
  if (s.dataVersion !== W.dataVersion) s.dataVersion = W.dataVersion;
  return s;
}
function load() {
  let raw = null; try { raw = localStorage.getItem(SAVE_KEY); } catch (e) { raw = null; }
  if (!raw) { toast('Aucune sauvegarde.'); return false; }
  G = migrate(JSON.parse(raw)); for (const k of Object.keys(SIG)) delete SIG[k]; closeModal(); render(); toast('Partie chargée : ' + fmtT(G.t)); return true;
}

/* ---------- Boucle ---------- */
let speed = 1, paused = false, acc = 0, last = performance.now();
function minute() {
  G.t += 1;
  tickNPCs();
  if (G.tail && G.tail.state === 'filature') tickTail(); else stepAlong(G.player, SPEED);
  runThreads(); runEvents(); observe(); deliver();
}
function frame(now) {
  const dt = Math.min(0.25, (now - last) / 1000); last = now;
  if (!paused && !modalOpen()) {
    acc += dt * speed * 10; // vitesse 1 = 10 minutes de jeu par seconde
    let n = 0; while (acc >= 1 && n < 200) { acc -= 1; minute(); n++; }
    if (n) render();
  }
  draw();
  requestAnimationFrame(frame);
}

  const f = $('facts'); f.innerHTML = '';
  for (const [id, text] of Object.entries(W.facts)) {
    const p = document.createElement('p'); p.style.color = G.facts[id] !== undefined ? 'var(--chalk)' : 'var(--dust)';
    p.textContent = id + (G.facts[id] !== undefined ? ' ✓ ' : ' · pas encore ') + text + (playerKnows(id) ? ' — connu du joueur' : ''); f.appendChild(p);
  }
  const l = $('wlog'); l.innerHTML = '';
  for (const e of G.log.slice().reverse()) { const p = document.createElement('div'); p.textContent = fmtT(e.t) + ' — ' + e.text; l.appendChild(p); }
}

/* Carte */
const cv = $('map'), cx = cv.getContext('2d');
function draw() {
  if (!G) return;
  cx.fillStyle = '#101214'; cx.fillRect(0, 0, 900, 600);
  for (const d of W.districts) {
    const [x, y, w, h] = d.rect; cx.fillStyle = d.fill; cx.fillRect(x, y, w, h);
    cx.fillStyle = 'rgba(230,226,216,.35)'; cx.font = '600 15px "IBM Plex Sans", sans-serif'; cx.fillText(d.name.toUpperCase(), x + 10, y + 22);
    cx.font = '11px "IBM Plex Mono", monospace'; cx.fillStyle = 'rgba(230,226,216,.25)'; cx.fillText(d.need, x + 10, y + 37);
  }
  cx.fillStyle = '#0b0c0d'; cx.fillRect(250, 0, 40, 600);
  cx.strokeStyle = '#3a3e44'; cx.setLineDash([6, 6]); cx.beginPath(); cx.moveTo(262, 0); cx.lineTo(262, 600); cx.moveTo(278, 0); cx.lineTo(278, 600); cx.stroke(); cx.setLineDash([]);
  for (const by of W.bridges) { cx.fillStyle = '#4a4f56'; cx.fillRect(248, by - 7, 44, 14); }
  cx.strokeStyle = '#353a41'; cx.beginPath(); cx.moveTo(290, 190); cx.lineTo(900, 190); cx.moveTo(290, 400); cx.lineTo(900, 400); cx.stroke();
  for (const [id, p] of Object.entries(W.places)) {
    cx.fillStyle = id === 'cabinet' ? '#c9964a' : '#5a5f66'; cx.fillRect(p.x - 5, p.y - 5, 10, 10);
    cx.fillStyle = 'rgba(230,226,216,.6)'; cx.font = '11px "IBM Plex Sans", sans-serif'; cx.fillText(p.name, p.x + 8, p.y + 4);
  }
  for (const id of Object.keys(G.npcs)) {
    if (!visible(id)) continue;
    const s = G.npcs[id];
    cx.beginPath(); cx.arc(s.x, s.y, 7, 0, Math.PI * 2);
    cx.fillStyle = G.tail && G.tail.target === id ? '#d26a5a' : '#cfd6e0'; cx.fill();
    cx.fillStyle = '#e6e2d8'; cx.font = '600 11px "IBM Plex Sans", sans-serif'; cx.fillText(W.npcs[id].short, s.x - 10, s.y - 11);
  }
  if (!G.away) {
    const p = G.player; cx.beginPath(); cx.arc(p.x, p.y, 9, 0, Math.PI * 2); cx.fillStyle = '#c9964a'; cx.fill();
    cx.strokeStyle = '#1a1408'; cx.lineWidth = 2; cx.stroke(); cx.lineWidth = 1;
    cx.beginPath(); cx.arc(p.x, p.y, 130, 0, Math.PI * 2); cx.strokeStyle = 'rgba(201,150,74,.18)'; cx.stroke();
  }
}
cv.addEventListener('click', e => {
  if (!G || G.away) return;
  const r = cv.getBoundingClientRect(); const x = (e.clientX - r.left) * 900 / r.width, y = (e.clientY - r.top) * 600 / r.height;
  const hit = Object.keys(G.npcs).find(id => visible(id) && Math.hypot(G.npcs[id].x - x, G.npcs[id].y - y) < 14);
  if (hit) { const near = Math.hypot(G.npcs[hit].x - G.player.x, G.npcs[hit].y - G.player.y) < 45; if (near) talk(hit); else toast(W.npcs[hit].name + ' : approchez-vous pour parler, ou suivez.'); return; }
  G.tail = null; G.player.path = route(G.player.x, G.player.y, x, y); render();
});

/* Modale */
function modalOpen() { return !$('modal').hidden; }
function showModal(title, html, fill, buttons) {
  const m = $('modal-body'); m.innerHTML = '<h2></h2>' + html + '<div class="choices"></div>';
  m.querySelector('h2').textContent = title; if (fill) fill(m);
  const c = m.querySelector('.choices');
  for (const b of buttons) { const x = document.createElement('button'); x.textContent = b.label; x.disabled = !!b.disabled; x.addEventListener('click', () => { b.act(); render(); }); c.appendChild(x); }
  $('modal').hidden = false; const f = c.querySelector('button:not(:disabled)'); if (f) f.focus();
}
function closeModal() { $('modal').hidden = true; }
function showEvent(ev) {
  showModal(ev.title, '<p class="kind"></p><p class="quote"></p>', m => { m.querySelector('.kind').textContent = 'Affaire ' + ev.klass + ' · ' + fmtT(G.t); m.querySelector('.quote').textContent = ev.text; },
    ev.choices.map(c => ({ label: c.label, act: () => { apply(c.effects); wlog('Choix du joueur (' + ev.title + ') : ' + c.label); closeModal(); } })));
}
function toast(msg) { const t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => { t.hidden = true; }, 3200); }

document.querySelectorAll('[data-speed]').forEach(b => b.addEventListener('click', () => {
  speed = +b.dataset.speed || 0; paused = speed === 0;
  document.querySelectorAll('[data-speed]').forEach(x => x.classList.toggle('on', x === b));
}));
$('btn-save').addEventListener('click', () => save(false));
$('btn-load').addEventListener('click', () => load());
$('btn-author').addEventListener('click', () => { G.author = !G.author; for (const k of Object.keys(SIG)) delete SIG[k]; $('btn-author').setAttribute('aria-pressed', G.author ? 'true' : 'false'); $('btn-author').classList.toggle('on', G.author); render(); });

newGame(); render(); requestAnimationFrame(frame);
// Accès pour les tests automatisés
window.__btt = { get G() { return G; }, minute, travel, save, load, scheduledPlace, startTail, apply, conds, openReport, conclude, W, newGame, render };
</script>
