    <script>
     Promise.all(["500 14px Poppins","700 20px Poppins","900 100px Playfair","700 24px OldStd","700 80px Caveat","800 60px Poppins","600 30px Poppins"].map((f) => document.fonts.load(f))).then(() => document.fonts.ready).then(() => {
      const tl = gsap.timeline({ paused: true });
      let seed = 0x3a7c;
      const rnd = () => { seed = (Math.imul(1664525, seed) + 1013904223) >>> 0; return seed / 4294967296; };
      const $ = (id) => document.getElementById(id);
      // scene cues were laid out on the first voice take; MAP re-times them onto the current take
      const MAP = [[0, 0], [1.18, 1.12], [2.14, 1.98], [3.6, 3.37], [5.29, 4.96], [6.6, 6.12], [8.07, 7.84], [9.24, 9.02], [10.56, 10.29], [11.6, 11.3], [11.82, 14.07], [12.66, 15.16], [13.6, 16.14], [14.62, 17.36], [15.76, 18.45], [17.5, 20.54], [19.35, 22.35], [22.46, 22.62], [24.27, 24.29], [25.3, 25.28], [26.6, 27.2], [27.36, 30.02], [28.94, 31.44]];
      const remap = (t) => { for (let i = 1; i < MAP.length; i++) if (t <= MAP[i][0]) { const [a, b] = MAP[i - 1], [c, d] = MAP[i]; return b + ((t - a) / (c - a)) * (d - b); } const [a, b] = MAP[MAP.length - 1]; return b + (t - a); };
      const V = (t) => remap(t) + 0.3;   // first-take voice seconds -> film seconds
      const N = (t) => t + 0.3;          // current-take voice seconds -> film seconds

      // ---------- builders ----------
      function jag(el) {
        const w = el.offsetWidth, h = el.offsetHeight, pts = [], st = 16, j = () => (rnd() * 5).toFixed(1);
        for (let x = 0; x <= w; x += st) pts.push(`${x}px ${j()}px`);
        for (let y = 0; y <= h; y += st) pts.push(`${w - j()}px ${y}px`);
        for (let x = w; x >= 0; x -= st) pts.push(`${x}px ${h - j()}px`);
        for (let y = h; y >= 0; y -= st) pts.push(`${j()}px ${y}px`);
        el.style.clipPath = `polygon(${pts.join(",")})`;
      }
      function clipping(parent, id, o) {
        const d = document.createElement("div"); d.className = "np"; d.id = id;
        d.style.left = o.x + "px"; d.style.top = o.y + "px"; d.style.width = o.w + "px";
        d.innerHTML = (o.hd ? `<div class="hd" style="font-size:${o.size}px">${o.hd.map((l) => `<span>${l}</span>`).join("")}</div>` : "") +
          (o.img ? `<img class="ph" src="${o.img}" style="height:${o.ih}px" alt="">` : "") + (o.art ? `<div class="art">${o.art}</div>` : "") + (o.cap ? `<div class="cap">${o.cap}</div>` : "");
        parent.appendChild(d); jag(d);
        const tp = document.createElement("div"); tp.className = "tape"; tp.id = id + "T"; parent.appendChild(tp);
        gsap.set(tp, { left: o.x + o.w / 2 - 65 + (rnd() - 0.5) * 60, top: o.y - 18, rotation: (rnd() - 0.5) * 10 });
        gsap.set([d, tp], { opacity: 0 });
        return d;
      }
      function slap(id, at, rot) {
        tl.fromTo("#" + id, { opacity: 0, y: -50, scale: 1.12, rotation: rot - 8 }, { opacity: 1, y: 0, scale: 1, rotation: rot, duration: 0.3, ease: "back.out(1.5)" }, at);
        tl.fromTo("#" + id + "T", { opacity: 0, scale: 1.4 }, { opacity: 1, scale: 1, duration: 0.16, ease: "power2.out" }, at + 0.14);
      }
