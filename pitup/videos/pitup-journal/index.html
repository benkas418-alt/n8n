<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Poppins"; font-weight: 600; src: url(assets/fonts/poppins-600.woff2) format("woff2"); }
      @font-face { font-family: "Poppins"; font-weight: 800; src: url(assets/fonts/poppins-800.woff2) format("woff2"); }
      @font-face { font-family: "Caveat"; font-weight: 700; src: url(assets/fonts/Caveat-700-latin.woff2) format("woff2"); }
      @font-face { font-family: "Playfair"; font-weight: 900; src: url(assets/fonts/PlayfairDisplay-900.woff2) format("woff2"); }
      @font-face { font-family: "OldStd"; font-weight: 700; src: url(assets/fonts/OldStandardTT-700.woff2) format("woff2"); }
      :root { --blue: #1f88c9; --ink: #141414; --hw-ink: #1f88c9; --red: #d6332a; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #f6f3ec; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "Poppins", sans-serif; color: var(--ink); }
      .layer { position: absolute; inset: 0; z-index: 0; }
      .sheet { position: absolute; inset: 0; overflow: hidden; }
      .paper { position: absolute; inset: 0; background: url(assets/paper.jpg) center / cover; }
      .blue { position: absolute; inset: 0; background: var(--blue); }
      .blue::after { content: ""; position: absolute; inset: 0; background: url(assets/paper.jpg) center / cover; mix-blend-mode: multiply; opacity: 0.55; }
      .rim { position: absolute; inset: 0; background: #fbfaf8; }

      .np { position: absolute; background: #fbf8f1; padding: 22px 28px 26px; box-shadow: 0 1px 1px rgba(0,0,0,0.06), 0 16px 28px rgba(40,30,10,0.16); }
      .np .art { display: block; margin-top: 10px; }
      .np .art svg { display: block; width: 100%; height: auto; }
      #phone { position: absolute; left: 290px; top: 650px; width: 500px; height: 770px; border-radius: 64px; background: #141414; padding: 18px; box-shadow: 0 30px 50px rgba(40,30,10,0.3); }
      #phone .scr { position: relative; width: 100%; height: 100%; border-radius: 48px; overflow: hidden; background: #fff; }
      #phone .bar { display: flex; align-items: center; gap: 14px; height: 120px; padding: 34px 30px 0; background: var(--blue); color: #fff; font-weight: 800; font-size: 40px; }
      #phone .bar img { width: 44px; display: block; }
      #phone .lbl { display: block; padding: 26px 30px 12px; font-weight: 800; font-size: 30px; color: var(--ink); }
      #phone .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px 0; justify-items: center; padding: 0 20px; }
      #phone .row img { width: 112px; height: 112px; border-radius: 50%; object-fit: cover; display: block; border: 3px solid #e8e8e8; }
      #phone .btn { position: absolute; left: 30px; right: 30px; bottom: 96px; height: 96px; border-radius: 48px; background: var(--blue); color: #fff; font-weight: 800; font-size: 32px; white-space: nowrap; display: flex; align-items: center; justify-content: center; }
      #phone .ok { background: #1f9d55; }
      #phone .sub { position: absolute; left: 0; right: 0; bottom: 40px; display: block; text-align: center; font-weight: 600; font-size: 24px; color: #555; }
      #tap { position: absolute; width: 90px; height: 90px; border-radius: 50%; border: 6px solid #141414; left: 187px; top: 545px; }
      .np .hd { display: block; font-family: "Playfair", serif; font-weight: 900; line-height: 1.02; letter-spacing: -1px; color: var(--ink); }
      .np .hd > span { display: block; white-space: nowrap; }
      .np .ph { display: block; width: 100%; object-fit: cover; margin-top: 4px; filter: contrast(1.05); }
      .np .cap { display: block; font-family: "OldStd", serif; font-weight: 700; font-size: 20px; color: #555; margin-top: 8px; white-space: nowrap; }
      .tape { position: absolute; width: 130px; height: 36px; background: rgba(236, 226, 196, 0.85); box-shadow: 0 1px 2px rgba(0,0,0,0.08);
        clip-path: polygon(0% 8%, 6% 0%, 12% 10%, 20% 2%, 30% 8%, 42% 0%, 55% 6%, 68% 0%, 80% 9%, 90% 1%, 100% 8%, 97% 50%, 100% 92%, 90% 100%, 78% 92%, 64% 100%, 50% 93%, 36% 100%, 22% 92%, 10% 100%, 0% 92%, 3% 50%); }
      .stamp { position: absolute; display: block; font-family: "Poppins", sans-serif; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; color: var(--red); border: 7px solid var(--red); border-radius: 10px; padding: 6px 18px; white-space: nowrap; mix-blend-mode: multiply; }

      .big { position: absolute; left: 76px; display: block; font-family: "Playfair", serif; font-weight: 900; line-height: 1.02; letter-spacing: -2px; color: var(--ink); }
      .big > span { display: block; white-space: nowrap; }
      .w { display: inline !important; }
      .note { position: absolute; display: block; font-family: "Caveat", cursive; font-weight: 700; color: var(--blue); white-space: nowrap; line-height: 1; }
      .hl { position: absolute; z-index: -1; background: rgba(31, 136, 201, 0.26); transform-origin: 0% 50%; border-radius: 4px; }
      .dot { position: absolute; border-radius: 50%; overflow: hidden; border: 6px solid #fff; background: #000; box-shadow: 0 10px 22px rgba(40,30,10,0.25); }
      .dot img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .hw-mark, .hw-arrow { position: absolute; pointer-events: none; }
      .hw-mark svg, .hw-arrow svg { width: 100%; height: 100%; overflow: visible; }
      .hw-mark path, .hw-arrow path { fill: none; stroke: var(--hw-ink); stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }

      /* the narrator */
      #guy { position: absolute; left: 0; top: 0; width: 340px; height: 470px; z-index: 30; }
      #guy svg { width: 100%; height: 100%; overflow: visible; }
      #bubble { position: absolute; z-index: 31; background: #fff; border: 4px solid #141414; border-radius: 26px; padding: 10px 22px; font-family: "Caveat", cursive; font-weight: 700; font-size: 54px; color: #141414; white-space: nowrap; }

      #end .icon { position: absolute; left: 395px; top: 380px; width: 290px; display: block; }
      #join { position: absolute; left: 0; right: 0; top: 850px; display: block; text-align: center; font-weight: 800; font-size: 124px; letter-spacing: -4px; color: #fff; white-space: nowrap; }
      #creates { position: absolute; left: 0; right: 0; top: 1030px; display: block; text-align: center; font-family: "Caveat", cursive; font-weight: 700; font-size: 66px; color: #fff; white-space: nowrap; }
      #ctaWrap { position: absolute; left: 0; right: 0; top: 1130px; display: flex; justify-content: center; }
      #cta { display: block; padding: 30px 70px; border-radius: 999px; background: #fff; color: var(--blue); font-weight: 800; font-size: 58px; white-space: nowrap; }
      #fine { position: absolute; left: 0; right: 0; top: 1320px; display: block; text-align: center; font-weight: 600; font-size: 34px; color: rgba(255,255,255,0.92); white-space: nowrap; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="37.5" data-width="1080" data-height="1920">
      <audio id="bgm" src="assets/bgm.wav" data-start="0" data-duration="37.5" data-track-index="11"></audio>
      <!-- halftone fills for the black-and-white newspaper illustrations -->
      <svg width="0" height="0" style="position:absolute"><defs>
        <pattern id="ht1" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="9" height="9" fill="#fbf8f1" /><circle cx="4.5" cy="4.5" r="1.5" fill="#141414" /></pattern>
        <pattern id="ht2" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="9" height="9" fill="#fbf8f1" /><circle cx="4.5" cy="4.5" r="2.7" fill="#141414" /></pattern>
        <pattern id="ht3" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="9" height="9" fill="#fbf8f1" /><circle cx="4.5" cy="4.5" r="3.7" fill="#141414" /></pattern>
      </defs></svg>
      <div id="scene" class="clip layer" data-start="0" data-duration="37.5" data-track-index="0">
        <div class="sheet" id="end">
          <div class="blue"></div>
          <img class="icon" src="assets/icon_white.png" alt="" />
          <div id="join">Rejoins PitUp.</div>
          <div id="creates">Crée ta boutique sur</div>
          <div id="ctaWrap"><div id="cta">pi-tup.com</div></div>
          <div id="fine">+100 boutiques partenaires · Lubumbashi</div>
        </div>
        <div class="sheet" id="p2Wrap"><div class="rim" id="p2Rim"></div><div class="sheet" id="p2"><div class="paper"></div><div id="dots" class="layer"></div><div id="s2" class="layer"></div></div></div>
        <div class="sheet" id="p1Wrap"><div class="rim" id="p1Rim"></div><div class="sheet" id="p1"><div class="paper"></div><div id="s1" class="layer"></div></div></div>

        <!-- narrator: a young Lushois in a PitUp tee (vector, built for this film) -->
        <div id="guy"><svg viewBox="0 0 340 470">
          <g id="gBody">
            <path d="M60 470 C60 360 100 320 170 320 C240 320 280 360 280 470 Z" fill="#1f88c9" />
            <path d="M150 322 L170 352 L190 322" fill="none" stroke="#156ea6" stroke-width="6" stroke-linecap="round" />
            <image href="assets/icon_white.png" x="146" y="378" width="48" height="54" />
            <g id="gArmL"><path d="M78 370 C40 400 34 440 44 470" stroke="#1f88c9" stroke-width="44" stroke-linecap="round" fill="none" /><circle cx="44" cy="470" r="22" fill="#6a3f24" /></g>
            <g id="gArmR"><path d="M262 370 C300 400 306 440 296 470" stroke="#1f88c9" stroke-width="44" stroke-linecap="round" fill="none" /><circle id="handR" cx="296" cy="470" r="22" fill="#6a3f24" /></g>
            <rect x="152" y="282" width="36" height="48" rx="14" fill="#5e371f" />
          </g>
          <g id="gHead">
            <ellipse cx="94" cy="190" rx="18" ry="24" fill="#6a3f24" />
            <ellipse cx="246" cy="190" rx="18" ry="24" fill="#6a3f24" />
            <ellipse cx="170" cy="180" rx="82" ry="104" fill="#7a4a2b" />
            <path d="M90 150 C88 70 140 58 170 58 C206 58 254 72 250 150 C236 112 210 100 170 100 C130 100 104 112 90 150 Z" fill="#1b1410" />
            <g id="gBrows"><path d="M118 146 Q138 134 156 144" stroke="#1b1410" stroke-width="8" fill="none" stroke-linecap="round" /><path d="M184 144 Q202 134 222 146" stroke="#1b1410" stroke-width="8" fill="none" stroke-linecap="round" /></g>
            <g id="gEyes"><ellipse cx="138" cy="172" rx="15" ry="17" fill="#fff" /><ellipse cx="202" cy="172" rx="15" ry="17" fill="#fff" /><circle cx="141" cy="175" r="8" fill="#1b1410" /><circle cx="205" cy="175" r="8" fill="#1b1410" /></g>
            <path d="M162 196 Q170 214 180 198" stroke="#5a3218" stroke-width="5" fill="none" stroke-linecap="round" />
            <g transform="translate(170 238)"><ellipse id="mouth" cx="0" cy="0" rx="24" ry="4" fill="#4a1414" /><rect id="teeth" x="-16" y="-6" width="32" height="6" rx="3" fill="#fff" /></g>
          </g>
        </svg></div>
        <div id="bubble">On est d'accord ?</div>
      </div>
    </div>

    <script src="assets/hw.js"></script>
    <script src="assets/mouth.js"></script>
    <script>
     Promise.all(["900 100px Playfair","700 24px OldStd","700 80px Caveat","800 60px Poppins","600 30px Poppins"].map((f) => document.fonts.load(f))).then(() => document.fonts.ready).then(() => {
      const tl = gsap.timeline({ paused: true });
      let seed = 0x3a7c;
      const rnd = () => { seed = (Math.imul(1664525, seed) + 1013904223) >>> 0; return seed / 4294967296; };
      const $ = (id) => document.getElementById(id);
      const V = (t) => t + 0.25;   // voice-file seconds -> film seconds

      // ---------- builders ----------
      function jag(el) {
        const w = el.offsetWidth, h = el.offsetHeight, pts = [], st = 16, j = () => (rnd() * 5).toFixed(1);
        for (let x = 0; x <= w; x += st) pts.push(`${x}px ${j()}px`);
        for (let y = 0; y <= h; y += st) pts.push(`${w - j()}px ${y}px`);
        for (let x = w; x >= 0; x -= st) pts.push(`${x}px ${h - j()}px`);
        for (let y = h; y >= 0; y -= st) pts.push(`${j()}px ${y}px`);
        el.style.clipPath = `polygon(${pts.join(",")})`;
      }
      function clipping(parent, id, o) {
        const d = document.createElement("div"); d.className = "np"; d.id = id;
        d.style.left = o.x + "px"; d.style.top = o.y + "px"; d.style.width = o.w + "px";
        d.innerHTML = (o.hd ? `<div class="hd" style="font-size:${o.size}px">${o.hd.map((l) => `<span>${l}</span>`).join("")}</div>` : "") +
          (o.img ? `<img class="ph" src="${o.img}" style="height:${o.ih}px" alt="">` : "") + (o.art ? `<div class="art">${o.art}</div>` : "") + (o.cap ? `<div class="cap">${o.cap}</div>` : "");
        parent.appendChild(d); jag(d);
        const tp = document.createElement("div"); tp.className = "tape"; tp.id = id + "T"; parent.appendChild(tp);
        gsap.set(tp, { left: o.x + o.w / 2 - 65 + (rnd() - 0.5) * 60, top: o.y - 18, rotation: (rnd() - 0.5) * 10 });
        gsap.set([d, tp], { opacity: 0 });
        return d;
      }
      function slap(id, at, rot) {
        tl.fromTo("#" + id, { opacity: 0, y: -50, scale: 1.12, rotation: rot - 8 }, { opacity: 1, y: 0, scale: 1, rotation: rot, duration: 0.3, ease: "back.out(1.5)" }, at);
        tl.fromTo("#" + id + "T", { opacity: 0, scale: 1.4 }, { opacity: 1, scale: 1, duration: 0.16, ease: "power2.out" }, at + 0.14);
      }
      function pull(ids, at) {
        ids.forEach((id, k) => {
          const dir = k % 2 ? 1 : -1, sel = $(id + "T") ? ["#" + id, "#" + id + "T"] : ["#" + id];
          tl.to(sel, { x: dir * 1300, y: -120 - k * 40, rotation: dir * 25, duration: 0.42, ease: "power3.in" }, at + k * 0.04);
        });
      }
      function text(parent, id, cls, html, css) {
        const d = document.createElement("div"); d.className = cls; d.id = id; d.innerHTML = html; Object.assign(d.style, css); parent.appendChild(d); gsap.set(d, { opacity: 0 }); return d;
      }
      function stamp(parent, id, label, css, at, rot) {
        const d = text(parent, id, "stamp", label, css);
        tl.fromTo(d, { opacity: 0, scale: 2.2, rotation: rot - 6 }, { opacity: 0.92, scale: 1, rotation: rot, duration: 0.18, ease: "power4.in" }, at);
        tl.fromTo(parent.parentElement, { x: 0 }, { x: 6, duration: 0.04, yoyo: true, repeat: 3, ease: "none" }, at + 0.18);
      }
      function rel(el, anc) { let x = 0, y = 0, e = el; while (e && e !== anc) { x += e.offsetLeft; y += e.offsetTop; e = e.offsetParent; } return { left: x, top: y, width: el.offsetWidth, height: el.offsetHeight, bottom: y + el.offsetHeight }; }
      function marker(parent, wordId, at, dur) {
        const r = rel($(wordId), parent), h = document.createElement("div"); h.className = "hl";
        Object.assign(h.style, { left: r.left - 8 + "px", top: r.top + r.height * 0.18 + "px", width: r.width + 16 + "px", height: r.height * 0.72 + "px" });
        parent.insertBefore(h, parent.firstChild); tl.fromTo(h, { scaleX: 0 }, { scaleX: 1, duration: dur || 0.35, ease: "power2.out" }, at); return h;
      }
      let mk = 0;
      function mark(parent, wordId, style, at, opt) {
        const r = rel($(wordId), parent), id = "mk" + mk++, pad = style === "ellipse" ? 34 : 6;
        const w = r.width + pad * 2, h = style === "ellipse" ? r.height + 40 : 40;
        const d = document.createElement("div"); d.className = "hw-mark"; d.id = id;
        const top = style === "ellipse" ? r.top - 20 : style === "strike" ? r.top + r.height * 0.45 : r.bottom - 8;
        Object.assign(d.style, { left: r.left - pad + "px", top: top + "px", width: w + "px", height: h + "px" });
        if (opt && opt.color) d.style.setProperty("--hw-ink", opt.color);
        d.innerHTML = `<svg viewBox="0 0 ${w} ${h}"><path></path></svg>`; parent.appendChild(d);
        d.querySelector("path").setAttribute("d", style === "ellipse" ? hwWobbleEllipse(w / 2, h / 2, w / 2 - 4, h / 2 - 4, 7 + mk, 0.07) : hwMarkPath(w, 40, style, 3 + mk));
        gsap.set(d, { opacity: 0 }); tl.set(d, { opacity: 1 }, at);
        hwMarkOn(tl, "#" + id, at, style === "ellipse" ? 0.45 : 0.35);
        return id;
      }
      function tear(id, s, at, dur) {
        const clipEl = $(id), rimEl = $(id + "Rim"), wrapEl = $(id + "Wrap");
        let st = s >>> 0; const r = () => { st = (Math.imul(1664525, st) + 1013904223) >>> 0; return st / 4294967296; };
        const noise = (k) => { const a = []; for (let i = 0; i <= k; i++) a.push(r() * 2 - 1); return (v) => { const f = v * k, i = Math.min(k - 1, Math.floor(f)); let u = f - i; u = u * u * (3 - 2 * u); return a[i] + (a[i + 1] - a[i]) * u; }; };
        const ROWS = 160, PX = 100 / 1080, wander = noise(6), core = noise(14), edge = [];
        for (let i = 0; i <= ROWS; i++) { const v = i / ROWS; edge.push({ y: (v * 100).toFixed(2) + "%", o: (v - 0.5) * 4 + (wander(v) * 46 + (r() * 2 - 1) * 3.5) * PX, rim: Math.min(16, Math.max(7, 7 + 9 * (core(v) * 0.5 + 0.5) + (r() * 2 - 1) * 3)) * PX }); }
        const ease = (p) => (p < 0.3 ? 0.2 * Math.pow(p / 0.3, 2) : 0.2 + 0.8 * (1 - Math.pow(1 - (p - 0.3) / 0.7, 3)));
        const paint = (p) => {
          const e = ease(Math.max(0, Math.min(1, p))), bx = -12 + 124 * e;
          let a = "100% 0%, 100% 100%", b = a;
          for (let i = ROWS; i >= 0; i--) { const x = bx + edge[i].o; a += `, ${x.toFixed(2)}% ${edge[i].y}`; b += `, ${(x - edge[i].rim).toFixed(2)}% ${edge[i].y}`; }
          clipEl.style.clipPath = `polygon(${a})`; rimEl.style.clipPath = `polygon(${b})`;
          wrapEl.style.transform = `translateX(${(3 * e).toFixed(3)}%) rotate(${(1.5 * e).toFixed(3)}deg)`;
          wrapEl.style.filter = `drop-shadow(0 ${(12 * e).toFixed(1)}px ${(24 * e).toFixed(1)}px rgba(0,0,0,0.25))`;
          wrapEl.style.opacity = e >= 0.999 ? 0 : 1;
        };
        paint(0); const pr = { p: 0 };
        tl.fromTo(pr, { p: 0 }, { p: 1, duration: dur, ease: "none", onUpdate: () => paint(pr.p) }, at);
      }

      // ================= PAGE 1 — the problem =================
      const s1 = $("s1");
      text(s1, "t0", "big", `<span>Soyons</span><span>honnêtes.</span>`, { top: "560px", fontSize: "170px" });
      tl.fromTo("#t0", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.25, ease: "power3.out" }, V(0));
      tl.to("#t0", { opacity: 0, y: -40, duration: 0.18, ease: "power2.in" }, V(1.0));

      // "Aujourd'hui, se déplacer, ça coûte." + a real 5000 FC note slapped on the page
      clipping(s1, "cA", { x: 50, y: 300, w: 980, size: 100, hd: ["Se déplacer,", `<span class="w" id="wCout">ça coûte.</span>`] });
      slap("cA", V(1.12), -1.5);
      const note = text(s1, "bill", "", `<img src="assets/real/billet_5000.png" style="width:100%;display:block;box-shadow:0 18px 30px rgba(0,0,0,0.25)">`, { position: "absolute", left: "250px", top: "720px", width: "640px" });
      tl.fromTo(note, { opacity: 0, x: 500, y: -200, rotation: 40, scale: 1.2 }, { opacity: 1, x: 0, y: 0, rotation: -7, scale: 1, duration: 0.42, ease: "power3.out" }, V(2.3));
      marker($("cA"), "wCout", V(2.55), 0.35);
      pull(["cA", "bill"], V(3.42));

      // "Le taxi-bus ? Plein à craquer."
      clipping(s1, "cB", { x: 60, y: 300, w: 960, size: 74, hd: ["Le taxi-bus ?"], img: "assets/real/bus_porte.jpg", ih: 520, cap: "Heure de pointe, ligne habituelle." });
      slap("cB", V(3.77), 1.2);
      stamp(s1, "stB", "Plein à craquer", { left: "170px", top: "700px", fontSize: "62px" }, V(4.82), -8);
      // second photo tucked under, the guy on the roof
      clipping(s1, "cB2", { x: 520, y: 1000, w: 500, size: 0, img: "assets/real/bus_toit.jpg", ih: 330 });
      slap("cB2", V(5.1), 4);
      pull(["cB", "cB2", "stB"], V(5.6));

      // "Le transport ? De plus en plus cher."
      clipping(s1, "cC", { x: 60, y: 300, w: 960, size: 74, hd: ["Le transport ?"], img: "assets/real/billets_mains.jpg", ih: 500 });
      slap("cC", V(5.92), -1.2);
      text(s1, "upTxt", "note", "de plus en plus cher.", { left: "120px", top: "1170px", fontSize: "104px", color: "#d6332a", transform: "rotate(-4deg)" });
      tl.fromTo("#upTxt", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.25 }, V(6.6));
      const upU = mark(s1, "upTxt", "underline", V(7.0), { color: "#d6332a" });
      pull(["cC"], V(7.9)); tl.to(["#upTxt", "#" + upU], { opacity: 0, duration: 0.2 }, V(7.9));

      // "Les bouchons. La chaleur. Et la flemme… on la connaît tous."
      clipping(s1, "cD", { x: 60, y: 300, w: 960, size: 74, hd: ["Les bouchons."], img: "assets/real/bouchon.jpg", ih: 430 });
      slap("cD", V(8.31), 1);
      // "La chaleur." — sun burning + a desk fan, halftone black & white
      const rays = Array.from({ length: 12 }, (_, k) => `<polygon points="110,47 130,47 120,12" fill="#141414" transform="rotate(${k * 30} 120 105)" />`).join("");

        `<svg viewBox="0 0 460 260"><rect width="460" height="260" fill="url(#ht1)" />

          <circle cx="345" cy="120" r="80" fill="none" stroke="#141414" stroke-width="6" /><circle cx="345" cy="120" r="14" fill="#141414" /></svg>` });
      slap("cE", V(9.2), -3);
      tl.to("#sunRays", { rotation: 90, svgOrigin: "120 105", duration: 3, ease: "none" }, V(9.2));

          <rect x="30" y="200" width="420" height="20" fill="#141414" /><rect x="40" y="218" width="14" height="30" fill="#141414" /><rect x="424" y="218" width="14" height="30" fill="#141414" />
          <ellipse cx="100" cy="142" rx="56" ry="22" fill="#fbf8f1" stroke="#141414" stroke-width="5" />

      slap("cF", V(10.25), 3);
      tl.fromTo("#flPh", { y: 0 }, { y: -4, duration: 0.25, ease: "sine.inOut", yoyo: true, repeat: 6 }, V(10.4));
      tl.fromTo(["#flScr", "#flGlow"], { opacity: 1 }, { opacity: 0.55, duration: 0.12, yoyo: true, repeat: 9, ease: "steps(1)" }, V(10.5));
      mark(s1, "wFl", "ellipse", V(10.6));
      pull(["cD", "cE", "cF"], V(12.15)); tl.to("#s1 .hw-mark", { opacity: 0, duration: 0.2 }, V(12.15));

      // "Résultat : le client reste chez lui." — map of the quartier, pin on his house, the trip to the shop crossed out
      text(s1, "t6", "big", `<span>Résultat :</span><span>le client</span><span>reste chez lui.</span>`, { top: "380px", fontSize: "124px" });
      tl.fromTo("#t6", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.25, ease: "power3.out" }, V(12.57));
      let houses = "";
      for (let y = 18; y < 410; y += 42) for (let x = 14; x < 830; x += 44) { if (rnd() < 0.3) continue; const z = 16 + rnd() * 12; houses += `<rect x="${(x + rnd() * 10).toFixed(1)}" y="${(y + rnd() * 10).toFixed(1)}" width="${z.toFixed(1)}" height="${(z * (0.7 + rnd() * 0.5)).toFixed(1)}" fill="#141414" opacity="0.8" />`; }
      const roads = [["M-20 300 C200 280 500 320 870 270", 34], ["M180 -20 L230 440", 22], ["M520 -20 C540 150 500 300 560 440", 22], ["M-20 120 L870 70", 18], ["M360 -20 L330 440", 14], ["M680 -20 L720 440", 14], ["M-20 400 L870 380", 14]]
        .map(([d, w]) => `<path d="${d}" stroke="#141414" stroke-width="${w + 6}" fill="none" /><path d="${d}" stroke="#fbf8f1" stroke-width="${w}" fill="none" />`).join("");
      const route = "M300 226 C380 252 470 200 586 198";
      clipping(s1, "cM", { x: 90, y: 810, w: 900, size: 0, art:
        `<svg viewBox="0 0 844 420"><defs><mask id="rMask" maskUnits="userSpaceOnUse" x="0" y="0" width="844" height="420"><path id="rDraw" d="${route}" stroke="#fff" stroke-width="24" fill="none" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" /></mask></defs>
          <rect width="844" height="420" fill="url(#ht1)" />${houses}${roads}
          <circle cx="270" cy="212" r="46" fill="#fbf8f1" stroke="#141414" stroke-width="3" /><rect x="246" y="204" width="48" height="36" fill="#fff" stroke="#141414" stroke-width="5" /><polygon points="238,208 270,178 302,208" fill="#141414" />
          <circle cx="615" cy="190" r="46" fill="#fbf8f1" stroke="#141414" stroke-width="3" /><rect x="590" y="184" width="50" height="34" fill="#fff" stroke="#141414" stroke-width="5" /><path d="M582 186 L590 162 L640 162 L648 186 Z" fill="#141414" />
          <path d="${route}" mask="url(#rMask)" stroke="#1f88c9" stroke-width="9" stroke-dasharray="2 16" stroke-linecap="round" fill="none" />
          <text x="545" y="270" font-family="Caveat" font-weight="700" font-size="44" fill="#141414" stroke="#fbf8f1" stroke-width="10" paint-order="stroke">la boutique</text>
          <text x="36" y="250" font-family="Caveat" font-weight="700" font-size="56" fill="#1f88c9" stroke="#fbf8f1" stroke-width="12" paint-order="stroke">chez lui</text>
          <path id="xA" d="M418 198 L466 246" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" stroke="#d6332a" stroke-width="11" stroke-linecap="round" fill="none" />
          <path id="xB" d="M466 198 L418 246" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" stroke="#d6332a" stroke-width="11" stroke-linecap="round" fill="none" />
          <g id="pin"><path d="M270 92 C246 92 232 110 232 128 C232 154 270 178 270 178 C270 178 308 154 308 128 C308 110 294 92 270 92 Z" fill="#d6332a" stroke="#141414" stroke-width="4" /><circle cx="270" cy="128" r="12" fill="#fff" /></g></svg>` });
      slap("cM", V(13.0), -1.2);
      tl.fromTo("#pin", { y: -170, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "bounce.out" }, V(13.4));
      tl.fromTo("#rDraw", { attr: { "stroke-dashoffset": 1 } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.5, ease: "power1.inOut" }, V(13.85));
      tl.fromTo("#xA", { attr: { "stroke-dashoffset": 1 } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.12, ease: "power2.out" }, V(14.4));
      tl.fromTo("#xB", { attr: { "stroke-dashoffset": 1 } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.12, ease: "power2.out" }, V(14.53));
      pull(["cM"], V(14.8)); tl.to("#t6", { opacity: 0, y: -40, duration: 0.18, ease: "power2.in" }, V(14.8));

      // "Mais il achète quand même. Sur son téléphone." — the order, on a phone
      text(s1, "t7", "big", `<span>Mais il achète</span><span>quand même.</span>`, { top: "380px", fontSize: "110px", color: "#1f88c9" });
      tl.fromTo("#t7", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.25, ease: "power3.out" }, V(15.01));
      const shops = [0, 1, 2, 3, 4, 5].map((i) => `<img src="assets/shops/0${i}.jpg" alt="">`).join("");
      const ph = text(s1, "phone", "", `<div class="scr"><div class="bar"><img src="assets/icon_white.png" alt="">PitUp</div><div class="lbl">Boutiques</div><div class="row">${shops}</div>
        <div class="btn" id="phBtn">Commander</div><div class="btn ok" id="phOk">✓ Commande envoyée</div><div class="sub">Paiement à la livraison</div><div id="tap"></div></div>`, {});
      gsap.set(["#phOk", "#tap"], { opacity: 0 });
      tl.fromTo(ph, { opacity: 0, y: 320, rotation: 8 }, { opacity: 1, y: 0, rotation: -3, duration: 0.45, ease: "power3.out" }, V(15.2));
      text(s1, "t8", "note", "sur son téléphone.", { left: "60px", top: "1440px", fontSize: "92px", color: "#141414", transform: "rotate(-3deg)" });
      tl.fromTo("#t8", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.25 }, V(16.4));
      tl.fromTo("#tap", { opacity: 1, scale: 0.4 }, { opacity: 0, scale: 1.6, duration: 0.35, ease: "power2.out" }, V(16.7));
      tl.fromTo("#phOk", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.2, ease: "back.out(2)" }, V(16.8));
      const u8 = mark(s1, "t8", "underline", V(16.85));
      tl.to(["#t7", "#t8", "#phone", "#" + u8], { opacity: 0, y: -40, duration: 0.18, ease: "power2.in" }, V(17.45));

      // "Alors, la vraie question : ta boutique, elle y est ?"
      text(s1, "q0", "note", "Alors, la vraie question :", { left: "80px", top: "560px", fontSize: "88px", color: "#141414" });
      tl.fromTo("#q0", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.25 }, V(17.7));
      text(s1, "q1", "big", `<span>Ta boutique,</span><span><span class="w" id="wY">elle y est ?</span></span>`, { top: "720px", fontSize: "150px" });
      tl.fromTo("#q1", { opacity: 0, scale: 1.08 }, { opacity: 1, scale: 1, duration: 0.3, ease: "expo.out" }, V(19.48));
      mark(s1, "wY", "ellipse", V(20.2));
      tear("p1", 0x7a9e11cf, V(20.9), 0.6);

      // ================= PAGE 2 — the answer =================
      const s2 = $("s2"), dots = $("dots");
      const free = (x, y, r, placed) => !(x > 40 && x < 1040 && y > 560 && y < 1180) && !(x > 680 && y > 1420) && placed.every((p) => Math.hypot(p.x - x, p.y - y) > p.r + r + 14);
      const placed = []; let tries = 0;
      while (placed.length < 24 && tries < 8000) { tries++; const r = 60 + rnd() * 24, x = r + 20 + rnd() * (1040 - 2 * r), y = 170 + r + rnd() * (1620 - 2 * r); if (free(x, y, r, placed)) placed.push({ x, y, r }); }
      placed.forEach((p, i) => {
        const d = document.createElement("div"); d.className = "dot"; d.id = "d" + i;
        Object.assign(d.style, { left: p.x - p.r + "px", top: p.y - p.r + "px", width: 2 * p.r + "px", height: 2 * p.r + "px" });
        d.innerHTML = `<img src="assets/shops/${String(i % 24).padStart(2, "0")}.jpg" alt="">`; dots.appendChild(d); gsap.set(d, { opacity: 0 });
      });
      let t = V(21.32), g = 0.15;
      placed.forEach((_, k) => { const i = (k * 7) % placed.length; tl.fromTo("#d" + i, { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.28, ease: "back.out(2.2)" }, t); t += g; g = Math.max(0.05, g * 0.9); });
      clipping(s2, "cG", { x: 60, y: 600, w: 960, size: 100, hd: [`<span class="w" style="color:#1f88c9">+100</span> boutiques`, `sont <span class="w" id="wDeja">déjà</span> sur PitUp.`] });
      slap("cG", V(21.32), -1.5);
      marker($("cG"), "wDeja", V(23.4), 0.35);
      tl.to("#dots", { opacity: 0.3, duration: 0.4 }, V(24.4));
      pull(["cG"], V(24.35));

      clipping(s2, "cH", { x: 90, y: 600, w: 820, size: 76, hd: ["Elles vendent en ligne."] });
      clipping(s2, "cI", { x: 170, y: 840, w: 560, size: 76, hd: ["PitUp livre."] });
      clipping(s2, "cJ", { x: 80, y: 1080, w: 920, size: 68, hd: ["Le client paie", "à la livraison."] });
      slap("cH", V(24.68), -2); slap("cI", V(26.0), 2); slap("cJ", V(26.74), -1);
      pull(["cH", "cI", "cJ"], V(28.55));

      text(s2, "t9", "big", `<span>Le commerce</span><span>change.</span>`, { top: "620px", fontSize: "150px" });
      tl.fromTo("#t9", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, V(29.11));
      text(s2, "t10", "note", "Ne le regarde pas passer.", { left: "80px", top: "1020px", fontSize: "104px", transform: "rotate(-3deg)" });
      tl.fromTo("#t10", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.25 }, V(30.44));
      mark(s2, "t10", "underline", V(30.9));
      tear("p2", 0x13579bdf, V(31.55), 0.6);

      tl.fromTo("#end .icon", { scale: 0.8, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(2)" }, V(31.9));
      tl.fromTo("#join", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, V(31.95));
      tl.fromTo("#creates", { opacity: 0 }, { opacity: 1, duration: 0.25 }, V(33.23));
      tl.fromTo("#cta", { scale: 0.7, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(2)" }, V(33.6));
      tl.fromTo("#fine", { opacity: 0 }, { opacity: 1, duration: 0.4 }, V(34.6));

      // ================= the narrator =================
      // bottom-right corner on the paper; leaves when the end card arrives
      gsap.set("#guy", { x: 740, y: 1500, transformOrigin: "50% 100%" });
      gsap.set("#bubble", { x: 600, y: 1410, opacity: 0 });
      tl.fromTo("#guy", { y: 1950 }, { y: 1500, duration: 0.45, ease: "back.out(1.6)" }, 0.05);
      // lip-sync from the voice envelope (deterministic, one value per frame)
      const lip = { f: 0 };
      tl.fromTo(lip, { f: 0 }, { f: MOUTH.length - 1, duration: (MOUTH.length - 1) / 30, ease: "none", onUpdate: () => {
        const v = MOUTH[Math.round(lip.f)] || 0; $("mouth").setAttribute("ry", (3 + v * 20).toFixed(1)); $("mouth").setAttribute("rx", (24 - v * 4).toFixed(1)); $("teeth").setAttribute("opacity", v > 0.25 ? 1 : 0);
      } }, 0);
      // idle bob + blinks
      tl.fromTo("#gHead", { y: 0, rotation: 0, transformOrigin: "170px 300px" }, { y: -6, rotation: 2, duration: 0.6, ease: "sine.inOut", yoyo: true, repeat: 55 }, 0);
      for (let b = 1.6; b < 32; b += 2.7 + ((b * 7) % 1.3)) { tl.to("#gEyes", { scaleY: 0.1, transformOrigin: "170px 175px", duration: 0.06 }, b); tl.to("#gEyes", { scaleY: 1, duration: 0.08 }, b + 0.08); }
      // poses — arm transforms around the shoulders
      const armR = (rot, at, d) => tl.to("#gArmR", { rotation: rot, svgOrigin: "262 370", duration: d || 0.25, ease: "power2.out" }, at);

      tl.to("#gHead", { rotation: -8, duration: 0.2 }, V(10.3));
      tl.fromTo("#bubble", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.2, ease: "back.out(2)" }, V(11.15));
      tl.to("#bubble", { opacity: 0, duration: 0.15 }, V(12.2));
      armL(110, V(19.4)); armL(0, V(21.0));                                               // points at the question
      tl.to("#guy", { scale: 1.06, duration: 0.15, yoyo: true, repeat: 1 }, V(21.32));     // jumps on the drop
      armR(-160, V(25.9)); armR(0, V(26.7));                                              // thumbs up "on livre"
      tl.to("#guy", { y: 1960, duration: 0.35, ease: "power3.in" }, V(31.4));

      hwBoil(tl, [".hw-mark", ".note"], { amp: 1.1, rot: 0.3, frameDrop: 3, seed: 5 });
      window.__timelines["main"] = tl;
      tl.seek(0);
     });
