    <script>
     Promise.all(["500 14px Poppins","700 20px Poppins","900 100px Playfair","700 24px OldStd","700 80px Caveat","800 60px Poppins","600 30px Poppins"].map((f) => document.fonts.load(f))).then(() => document.fonts.ready).then(() => {
      const tl = gsap.timeline({ paused: true });
      let seed = 0x3a7c;
      const rnd = () => { seed = (Math.imul(1664525, seed) + 1013904223) >>> 0; return seed / 4294967296; };
      const $ = (id) => document.getElementById(id);
      const N = (t) => t + 0.3;   // voice-file seconds -> film seconds

      // ---------- builders ----------
      function jag(el) {
        const w = el.offsetWidth, h = el.offsetHeight, pts = [], st = 16, j = () => (rnd() * 5).toFixed(1);
        for (let x = 0; x <= w; x += st) pts.push(`${x}px ${j()}px`);
        for (let y = 0; y <= h; y += st) pts.push(`${w - j()}px ${y}px`);
        for (let x = w; x >= 0; x -= st) pts.push(`${x}px ${h - j()}px`);
        for (let y = h; y >= 0; y -= st) pts.push(`${j()}px ${y}px`);
        el.style.clipPath = `polygon(${pts.join(",")})`;
      }
      function clipping(parent, id, o) {
        const d = document.createElement("div"); d.className = "np"; d.id = id;
        d.style.left = o.x + "px"; d.style.top = o.y + "px"; d.style.width = o.w + "px";
        d.innerHTML = (o.hd ? `<div class="hd" style="font-size:${o.size}px">${o.hd.map((l) => `<span>${l}</span>`).join("")}</div>` : "") +
          (o.img ? `<img class="ph" src="${o.img}" style="height:${o.ih}px" alt="">` : "") + (o.art ? `<div class="art">${o.art}</div>` : "") + (o.cap ? `<div class="cap">${o.cap}</div>` : "");
        parent.appendChild(d); jag(d);
        const tp = document.createElement("div"); tp.className = "tape"; tp.id = id + "T"; parent.appendChild(tp);
        gsap.set(tp, { left: o.x + o.w / 2 - 65 + (rnd() - 0.5) * 60, top: o.y - 18, rotation: (rnd() - 0.5) * 10 });
        gsap.set([d, tp], { opacity: 0 });
        return d;
      }
      function slap(id, at, rot) {
        tl.fromTo("#" + id, { opacity: 0, y: -50, scale: 1.12, rotation: rot - 8 }, { opacity: 1, y: 0, scale: 1, rotation: rot, duration: 0.3, ease: "back.out(1.5)" }, at);
        tl.fromTo("#" + id + "T", { opacity: 0, scale: 1.4 }, { opacity: 1, scale: 1, duration: 0.16, ease: "power2.out" }, at + 0.14);
      }
      function pull(ids, at) {
        ids.forEach((id, k) => {
          const dir = k % 2 ? 1 : -1, sel = $(id + "T") ? ["#" + id, "#" + id + "T"] : ["#" + id];
          tl.to(sel, { x: dir * 1300, y: -120 - k * 40, rotation: dir * 25, duration: 0.42, ease: "power3.in" }, at + k * 0.04);
        });
      }
      function text(parent, id, cls, html, css) {
        const d = document.createElement("div"); d.className = cls; d.id = id; d.innerHTML = html; Object.assign(d.style, css); parent.appendChild(d); gsap.set(d, { opacity: 0 }); return d;
      }
      function stamp(parent, id, label, css, at, rot) {
        const d = text(parent, id, "stamp", label, css);
        tl.fromTo(d, { opacity: 0, scale: 2.2, rotation: rot - 6 }, { opacity: 0.92, scale: 1, rotation: rot, duration: 0.18, ease: "power4.in" }, at);
        tl.fromTo(parent.parentElement, { x: 0 }, { x: 6, duration: 0.04, yoyo: true, repeat: 3, ease: "none" }, at + 0.18);
      }
      function rel(el, anc) { let x = 0, y = 0, e = el; while (e && e !== anc) { x += e.offsetLeft; y += e.offsetTop; e = e.offsetParent; } return { left: x, top: y, width: el.offsetWidth, height: el.offsetHeight, bottom: y + el.offsetHeight }; }
      function marker(parent, wordId, at, dur) {
        const r = rel($(wordId), parent), h = document.createElement("div"); h.className = "hl";
        Object.assign(h.style, { left: r.left - 8 + "px", top: r.top + r.height * 0.18 + "px", width: r.width + 16 + "px", height: r.height * 0.72 + "px" });
        parent.insertBefore(h, parent.firstChild); tl.fromTo(h, { scaleX: 0 }, { scaleX: 1, duration: dur || 0.35, ease: "power2.out" }, at); return h;
      }
      let mk = 0;
      function mark(parent, wordId, style, at, opt) {
        const r = rel($(wordId), parent), id = "mk" + mk++, pad = style === "ellipse" ? 34 : 6;
        const w = r.width + pad * 2, h = style === "ellipse" ? r.height + 40 : 40;
        const d = document.createElement("div"); d.className = "hw-mark"; d.id = id;
        const top = style === "ellipse" ? r.top - 20 : style === "strike" ? r.top + r.height * 0.45 : r.bottom - 8;
        Object.assign(d.style, { left: r.left - pad + "px", top: top + "px", width: w + "px", height: h + "px" });
        if (opt && opt.color) d.style.setProperty("--hw-ink", opt.color);
        d.innerHTML = `<svg viewBox="0 0 ${w} ${h}"><path></path></svg>`; parent.appendChild(d);
        d.querySelector("path").setAttribute("d", style === "ellipse" ? hwWobbleEllipse(w / 2, h / 2, w / 2 - 4, h / 2 - 4, 7 + mk, 0.07) : hwMarkPath(w, 40, style, 3 + mk));
        gsap.set(d, { opacity: 0 }); tl.set(d, { opacity: 1 }, at);
        hwMarkOn(tl, "#" + id, at, style === "ellipse" ? 0.45 : 0.35);
        return id;
      }
      function tear(id, s, at, dur) {
        const clipEl = $(id), rimEl = $(id + "Rim"), wrapEl = $(id + "Wrap");
        let st = s >>> 0; const r = () => { st = (Math.imul(1664525, st) + 1013904223) >>> 0; return st / 4294967296; };
        const noise = (k) => { const a = []; for (let i = 0; i <= k; i++) a.push(r() * 2 - 1); return (v) => { const f = v * k, i = Math.min(k - 1, Math.floor(f)); let u = f - i; u = u * u * (3 - 2 * u); return a[i] + (a[i + 1] - a[i]) * u; }; };
        const ROWS = 160, PX = 100 / 1080, wander = noise(6), core = noise(14), edge = [];
        for (let i = 0; i <= ROWS; i++) { const v = i / ROWS; edge.push({ y: (v * 100).toFixed(2) + "%", o: (v - 0.5) * 4 + (wander(v) * 46 + (r() * 2 - 1) * 3.5) * PX, rim: Math.min(16, Math.max(7, 7 + 9 * (core(v) * 0.5 + 0.5) + (r() * 2 - 1) * 3)) * PX }); }
        const ease = (p) => (p < 0.3 ? 0.2 * Math.pow(p / 0.3, 2) : 0.2 + 0.8 * (1 - Math.pow(1 - (p - 0.3) / 0.7, 3)));
        const paint = (p) => {
          const e = ease(Math.max(0, Math.min(1, p))), bx = -12 + 124 * e;

          for (let i = ROWS; i >= 0; i--) { const x = bx + edge[i].o; a += `, ${x.toFixed(2)}% ${edge[i].y}`; b += `, ${(x - edge[i].rim).toFixed(2)}% ${edge[i].y}`; }

          wrapEl.style.filter = `drop-shadow(0 ${(12 * e).toFixed(1)}px ${(24 * e).toFixed(1)}px rgba(0,0,0,0.25))`;
          wrapEl.style.opacity = e >= 0.999 ? 0 : 1;
        };
        paint(0); const pr = { p: 0 };
        tl.fromTo(pr, { p: 0 }, { p: 1, duration: dur, ease: "none", onUpdate: () => paint(pr.p) }, at);
      }

      // ================= PAGE 1 — the heat, the product, the two packs =================
      const s1 = $("s1");
      const ico = {
        search: `<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>`,
        bag: `<svg viewBox="0 0 24 24"><path d="M5 8h14l-1 12H6z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>`,
        fork: `<svg viewBox="0 0 24 24"><path d="M5 3l14 18M19 3L5 21"/></svg>`,
        grid: `<svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1"/><rect x="13" y="4" width="7" height="7" rx="1"/><rect x="4" y="13" width="7" height="7" rx="1"/><rect x="13" y="13" width="7" height="7" rx="1"/></svg>`,
        user: `<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4.5 4.5-6 8-6s7 1.5 8 6"/></svg>`,
        home: `<svg viewBox="0 0 24 24"><path d="M4 10l8-6 8 6v10h-5v-6H9v6H4z"/></svg>`,

        shop: `<svg viewBox="0 0 24 24"><path d="M4 9l2-5h12l2 5M4 9h16v11H4zM9 20v-6h6v6"/></svg>`,
        back: `<svg viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>`,
        pin: `<svg viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>`,
        heart: `<svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>`,
        shield: `<svg viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></svg>`,
      };
      const nav = (on) => `<div class="nav">${[["home", "Accueil"], ["bag", "Commander"], ["offer", "Offres"], ["shop", "Marché"], ["search", "Découvrir"]].map(([i, l]) => `<div class="${l === on ? "on" : ""}">${ico[i]}<span>${l}</span></div>`).join("")}</div>`;
      const top = `<div class="sb"><b>14:30</b><span class="sbi"><svg viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2.5" width="3" height="9.5" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg><svg viewBox="0 0 16 12"><path d="M8 11.5l2.4-2.9a3.6 3.6 0 0 0-4.8 0zM3.3 6.4a7 7 0 0 1 9.4 0l1.6-1.9a9.6 9.6 0 0 0-12.6 0zM.2 3.3a11.6 11.6 0 0 1 15.6 0" /></svg><svg viewBox="0 0 27 13"><rect x="0.5" y="0.5" width="23" height="12" rx="3.5" fill="none" stroke-width="1"/><rect x="2.5" y="2.5" width="16" height="8" rx="2"/><rect x="25" y="4" width="1.6" height="5" rx="0.8"/></svg></span></div>

      // "Il fait très chaud à Louchi, hein ?"
      text(s1, "t0", "big", `<span>Il fait très chaud</span><span>à <span class="w" style="color:#d6332a">Lushi.</span></span>`, { top: "250px", fontSize: "128px" });
      tl.fromTo("#t0", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.25, ease: "power3.out" }, N(0.08));
      const rays = Array.from({ length: 14 }, (_, k) => `<polygon points="217,30 243,30 230,-14" fill="#141414" transform="rotate(${k * (360 / 14)} 230 140)" />`).join("");
      const heat = [150, 230, 310].map((x) => `<path class="heat" d="M${x} 300 q-14 -14 0 -28 t0 -28" stroke="#141414" stroke-width="6" fill="none" stroke-linecap="round" />`).join("");
      clipping(s1, "cSun", { x: 160, y: 620, w: 760, size: 0, art:
        `<svg viewBox="0 0 460 360" style="overflow:hidden"><rect width="460" height="360" fill="url(#ht1)" /><g id="sunRays">${rays}</g>
          <circle cx="230" cy="140" r="78" fill="#fbf8f1" stroke="#141414" stroke-width="7" /><circle cx="230" cy="140" r="58" fill="url(#ht2)" />${heat}
          <rect y="318" width="460" height="42" fill="url(#ht3)" /></svg>` });
      slap("cSun", N(0.5), -2);
      tl.to("#sunRays", { rotation: 40, svgOrigin: "230 140", duration: 3, ease: "none" }, N(0.5));
      tl.fromTo("#cSun .heat", { y: 8, opacity: 0.3 }, { y: -8, opacity: 1, duration: 0.35, ease: "sine.inOut", yoyo: true, repeat: 5, stagger: 0.12 }, N(0.6));
      text(s1, "sol", "note", "PitUp a la solution…", { left: "120px", top: "1350px", fontSize: "84px", transform: "rotate(-3deg)" });
      tl.fromTo("#sol", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.2 }, N(1.98));
      pull(["cSun"], N(3.1)); tl.to(["#t0", "#sol"], { opacity: 0, y: -30, duration: 0.15 }, N(3.1));

      // "le mini ventilateur ! Petit, il tient dans la main. Il y a plusieurs couleurs. Et pour les enfants, des modèles tout mignons."
      const prod = (id, title, img, at, rot, pos) => { clipping(s1, id, { x: 70, y: 330, w: 940, size: 84, hd: title, img, ih: 780, pos: pos || "50% 50%" }); slap(id, at, rot); };
      prod("cP1", ["Le mini ventilateur."], "assets/chic/fan_hand.jpg", N(3.33), -1.5, "50% 45%");

      prod("cP3", [`<span class="w" id="wKids">Pour les enfants.</span>`], "assets/chic/fan_kids.jpg", N(8.18), -1);
      text(s1, "mign", "note", "tout mignons ♥", { left: "520px", top: "1350px", fontSize: "80px", color: "#d6332a", transform: "rotate(-4deg)" });
      tl.fromTo("#mign", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(2)" }, N(9.65));
      pull(["cP3"], N(10.4)); tl.to("#mign", { opacity: 0, duration: 0.15 }, N(10.4));

      // "Deux offres, livraison comprise. Pack Duo… Pack Famille… Et tu paies à la livraison."
      text(s1, "two", "note", "2 offres · livraison comprise", { left: "70px", top: "150px", fontSize: "76px", color: "#141414" });
