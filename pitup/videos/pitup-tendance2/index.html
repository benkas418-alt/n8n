<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Poppins"; font-weight: 500; src: url(assets/fonts/poppins-500.woff2) format("woff2"); }
      @font-face { font-family: "Poppins"; font-weight: 600; src: url(assets/fonts/poppins-600.woff2) format("woff2"); }
      @font-face { font-family: "Poppins"; font-weight: 700; src: url(assets/fonts/poppins-700.woff2) format("woff2"); }
      @font-face { font-family: "Poppins"; font-weight: 800; src: url(assets/fonts/poppins-800.woff2) format("woff2"); }
      :root { --blue: #1f88c9; --ink: #0d0f13; --cream: #efe6d8; --sand: #d9ccb6; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--ink); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "Poppins", sans-serif; color: var(--ink); }
      .layer { position: absolute; inset: 0; }
      #cam { position: absolute; inset: 0; }

      /* A — product beats */
      .shot { position: absolute; inset: 0; opacity: 0; }
      .shot .bg { position: absolute; inset: 0; }
      .shot .giant { position: absolute; left: 0; right: 0; top: 760px; display: block; text-align: center; font-weight: 800; letter-spacing: -8px; line-height: 0.86; white-space: nowrap; }
      .shot .prod { position: absolute; left: 130px; right: 130px; top: 640px; height: 860px; display: flex; align-items: center; justify-content: center; }
      .shot .prod img { display: block; width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 46px 38px rgba(0, 0, 0, 0.34)) drop-shadow(0 8px 10px rgba(0, 0, 0, 0.2)); }
      .shot .sweep { position: absolute; inset: 0; pointer-events: none; mix-blend-mode: soft-light;
        background: linear-gradient(115deg, rgba(255,255,255,0) 38%, rgba(255,255,255,0.95) 50%, rgba(255,255,255,0) 62%); background-size: 300% 100%;
        -webkit-mask-size: contain; -webkit-mask-repeat: no-repeat; -webkit-mask-position: center; }
      .shot .head { position: absolute; left: 76px; top: 300px; display: block; font-weight: 800; font-size: 104px; letter-spacing: -3px; line-height: 1; white-space: nowrap; }
      .shot .idx { position: absolute; right: 76px; top: 318px; display: block; font-weight: 600; font-size: 30px; letter-spacing: 2px; }

      /* pinned anchor (never moves) */
      #anchor { position: absolute; left: 76px; top: 200px; display: flex; align-items: center; gap: 16px; font-weight: 600; font-size: 30px; letter-spacing: 1px; }
      #anchor img { width: 44px; height: auto; display: block; }

      /* A2 — assemble */
      #asm { position: absolute; inset: 0; opacity: 0; background: var(--ink); }
      #asm .t { position: absolute; left: 76px; top: 300px; display: block; font-weight: 800; font-size: 104px; letter-spacing: -3px; line-height: 1.02; color: #fff; white-space: nowrap; }
      #asm .t b { color: #5fb6ee; font-weight: 800; }
      .mini { position: absolute; width: 300px; height: 300px; display: flex; align-items: center; justify-content: center; }
      .mini img { display: block; max-width: 100%; max-height: 100%; filter: drop-shadow(0 24px 22px rgba(0, 0, 0, 0.5)); }

      /* B — statements */
      #stm { position: absolute; inset: 0; opacity: 0; background: var(--blue); }
      #stm .s { position: absolute; left: 76px; display: block; font-weight: 800; font-size: 116px; letter-spacing: -4px; line-height: 1; color: #fff; white-space: nowrap; }
      #stm .s.dim { color: rgba(255, 255, 255, 0.38); }
      #tumble { position: absolute; left: 0; top: 0; width: 520px; height: 300px; display: flex; align-items: center; justify-content: center; }
      #tumble img { display: block; max-width: 100%; max-height: 100%; filter: drop-shadow(0 30px 26px rgba(0, 0, 0, 0.35)); }

      /* whip strip */
      #whipblur { position: absolute; width: 0; height: 0; }

      /* C — flat lay */
      #lay { position: absolute; inset: 0; opacity: 0; background: var(--sand); }
      #layworld { position: absolute; inset: 0; }
      .lay { position: absolute; display: flex; align-items: center; justify-content: center; }
      .lay img { display: block; max-width: 100%; max-height: 100%; filter: drop-shadow(0 22px 18px rgba(40, 28, 10, 0.32)); }
      #laysweep { position: absolute; inset: -200px; pointer-events: none; mix-blend-mode: soft-light;
        background: linear-gradient(115deg, rgba(255,255,255,0) 40%, rgba(255,255,255,0.85) 50%, rgba(255,255,255,0) 60%); }
      #payA, #payB { position: absolute; left: 76px; display: block; font-weight: 800; font-size: 118px; letter-spacing: -4px; line-height: 1; color: var(--ink); white-space: nowrap; }
      #payB span { color: var(--blue); }
      #paysub { position: absolute; left: 80px; top: 1600px; display: block; font-weight: 600; font-size: 40px; color: #3b3328; white-space: nowrap; }
      #paycard { position: absolute; left: 60px; right: 60px; top: 1290px; height: 400px; border-radius: 40px; background: rgba(239, 230, 216, 0.9); }

      /* D — brand */
      #end { position: absolute; inset: 0; opacity: 0; background: var(--blue); }
      #ring { position: absolute; left: 340px; top: 400px; width: 400px; height: 400px; border-radius: 50%; border: 10px solid #fff; opacity: 0; }
      #icon { position: absolute; left: 395px; top: 455px; width: 290px; display: block; }
      #word { position: absolute; left: 305px; top: 860px; width: 470px; display: block; }
      #tag { position: absolute; left: 260px; top: 1090px; width: 560px; display: block; }
      #count { position: absolute; left: 0; right: 0; top: 1220px; display: block; text-align: center; font-weight: 800; font-size: 56px; letter-spacing: -1px; color: #fff; white-space: nowrap; }
      #ctaWrap { position: absolute; left: 0; right: 0; top: 1360px; display: flex; justify-content: center; }
      #cta { display: block; padding: 30px 70px; border-radius: 999px; background: #fff; color: var(--blue); font-weight: 800; font-size: 58px; white-space: nowrap; }
      #stores { position: absolute; left: 0; right: 0; top: 1540px; display: flex; justify-content: center; gap: 24px; }
      .bdg { display: flex; align-items: center; gap: 14px; height: 96px; padding: 0 28px 0 20px; border-radius: 18px; background: #000; border: 2px solid #a6a6a6; color: #fff; }
      .bdg svg { width: 52px; height: 52px; display: block; }
      .bdg span { display: flex; flex-direction: column; line-height: 1; }
      .bdg small { font-weight: 500; font-size: 20px; letter-spacing: 0.5px; }
      .bdg b { font-weight: 600; font-size: 38px; letter-spacing: -0.5px; margin-top: 4px; white-space: nowrap; }

      #flash { position: absolute; inset: 0; background: #fff; opacity: 0; }
      #grain { position: absolute; inset: -64px; background-image: url(assets/grain.png); background-size: 512px 512px; mix-blend-mode: overlay; opacity: 0.16; pointer-events: none; }
      #vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(1300px 1700px at 50% 48%, rgba(0,0,0,0) 55%, rgba(0,0,0,0.28) 100%); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="21" data-width="1080" data-height="1920">
      <audio id="bgm" src="assets/bgm.wav" data-start="0" data-duration="21" data-track-index="11"></audio>

      <div id="scene" class="clip layer" data-start="0" data-duration="21" data-track-index="0">
        <div id="cam">
          <div id="shots"></div>
          <div id="asm"><div class="t" id="asmT"><span style="display:block">Tout ça,</span><b style="display:block">à Lubumbashi.</b></div></div>
          <div id="stm">
            <div class="s" id="s1" style="top: 520px">Tu choisis.</div>
            <div class="s" id="s2" style="top: 690px">Tu commandes.</div>
            <div class="s" id="s3" style="top: 860px">On te livre.</div>
            <div id="tumble"><img src="assets/prod/sneakers.png" alt="" /></div>
          </div>
          <div id="lay">
            <div id="layworld"></div>
            <div id="laysweep"></div>
            <div id="paycard"></div>
            <div id="payA" style="top: 1340px">Tu paies</div>
            <div id="payB" style="top: 1462px"><span>à la livraison.</span></div>
            <div id="paysub">Rien à payer avant de recevoir.</div>
          </div>
          <div id="end">
            <div id="ring"></div>
            <img id="icon" src="assets/icon_white.png" alt="" />
            <img id="word" src="assets/logo_word_white.png" alt="" />
            <img id="tag" src="assets/logo_tag_white.png" alt="" />
            <div id="count">+100 boutiques à Lubumbashi</div>
            <div id="ctaWrap"><div id="cta">pi-tup.com</div></div>
            <div id="stores">
              <div class="bdg"><svg viewBox="0 0 24 24"><path fill="#fff" d="M16.4 1.4c0 1.1-.5 2.3-1.2 3.1-.7.9-2 1.6-3 1.6-.1 0-.2 0-.3-.1 0-.1 0-.2 0-.4 0-1.1.6-2.3 1.2-3 .8-.9 2.1-1.6 3.2-1.7.1.2.1.3.1.5zm4.6 15.7c0 .1-.5 1.6-1.5 3.1-.9 1.3-1.9 2.7-3.4 2.7s-1.9-.9-3.6-.9c-1.7 0-2.3.9-3.7.9-1.4 0-2.3-1.3-3.4-2.8C4.1 18.3 3 15.5 3 12.8c0-4.3 2.8-6.5 5.6-6.5 1.4 0 2.7.9 3.6.9.9 0 2.2-1 3.9-1 .6 0 2.9.1 4.4 2.2-.1.1-2.4 1.4-2.4 4.2 0 3.3 2.9 4.4 2.9 4.5z"/></svg><span><small>Disponible sur</small><b>App Store</b></span></div>
              <div class="bdg"><svg viewBox="0 0 24 24"><path fill="#00d7fe" d="M3.6 1.8 13.6 12 3.6 22.2c-.4-.2-.6-.6-.6-1.1V2.9c0-.5.2-.9.6-1.1z"/><path fill="#00f076" d="M3.6 1.8 16.9 9.4 13.6 12z"/><path fill="#f8384b" d="M3.6 22.2 13.6 12l3.3 2.6z"/><path fill="#fdbd00" d="M16.9 9.4 21 11.7c.5.3.5.9 0 1.2l-4.1 1.7-3.3-2.6z"/></svg><span><small>Disponible sur</small><b>Google Play</b></span></div>
            </div>
          </div>
        </div>
        <div id="anchor"><img id="anchorIcon" src="assets/icon.png" alt="" /><span id="anchorTxt">PitUp · Lubumbashi</span></div>
        <div id="flash"></div>
        <div id="vignette"></div>
        <div id="grain"></div>
      </div>
    </div>

    <script>
      const B = 0.3897;              // one beat of "Enemy" (measured grid, film 0 = song 35.0 s)
      const T = (b) => b * B;
      const tl = gsap.timeline({ paused: true });

      // ---------- A: product beats (fixed anchor, cycling world) ----------
      const P = [
        { f: "veste",    head: "Ta veste en cuir.", word: "CUIR",     bg: "#EFE6D8", tone: "#E3D6C2", ink: "#17120d", size: 400 },
        { f: "sneakers", head: "Tes sneakers.",     word: "SNEAKERS", bg: "#1F88C9", tone: "#2793D4", ink: "#ffffff", size: 230 },
        { f: "cargo",    head: "Ton cargo.",        word: "CARGO",    bg: "#D9CCB6", tone: "#CDBEA5", ink: "#17120d", size: 330 },
        { f: "sacados",  head: "Ton sac à dos.",    word: "SAC À DOS",bg: "#0D0F13", tone: "#171B22", ink: "#ffffff", size: 200 },
        { f: "parfum",   head: "Ton parfum.",       word: "PARFUM",   bg: "#1F88C9", tone: "#2793D4", ink: "#ffffff", size: 270 },
      ];
      const shots = document.getElementById("shots");
      P.forEach((p, i) => {
        const d = document.createElement("div");
        d.className = "shot"; d.id = "shot" + i;
        d.innerHTML =
          `<div class="bg" style="background:${p.bg}"></div>` +
          `<div class="giant" style="font-size:${p.size}px;color:${p.tone}">${p.word}</div>` +
          `<div class="prod"><img src="assets/prod/${p.f}.png" alt=""><div class="sweep" style="-webkit-mask-image:url(assets/prod/${p.f}.png)"></div></div>` +
          `<div class="head" style="color:${p.ink}">${p.head}</div>`;
        shots.appendChild(d);
      });

      // cut list: [shot, beat]. 2-beat steps, then an accelerating flurry, then hold.
      const cuts = [[0,0],[1,2],[2,4],[3,6],[4,8],[0,10],[1,10.5],[2,11],[3,11.33],[4,11.66]];
      const anchorInk = (i) => P[i].ink;
      cuts.forEach(([i, b], k) => {
        const el = "#shot" + i, at = k === 0 ? 0 : T(b);
        const next = cuts[k + 1] ? T(cuts[k + 1][1]) : T(12);
        const span = next - at;
        // 0ms hard cut in, previous shot hard cut out
        tl.set(el, { opacity: 1, zIndex: 10 + k }, at);
        tl.set(el, { opacity: 0 }, next);
        tl.set("#anchorTxt", { color: anchorInk(i) }, at);
        tl.set("#anchorIcon", { attr: { src: P[i].ink === "#ffffff" ? "assets/icon_white.png" : "assets/icon.png" } }, at);
        // reactive settle (fires on the hit): product drops 3% + rises 24px, eased 0.34s
        tl.fromTo(el + " .prod", { scale: 1.05, y: 24 }, { scale: 1, y: 0, duration: Math.min(0.34, span), ease: "power3.out" }, at);
        // giant word drifts slowly opposite to give depth (parallax)
        tl.fromTo(el + " .giant", { x: 30 }, { x: -30, duration: span, ease: "none" }, at);
        // headline: masked rise on the hit (only when the beat is long enough to read)
        if (k === 0) {
          tl.set(el + " .head", { yPercent: 0, opacity: 1 }, 0);
          tl.fromTo(el + " .sweep", { backgroundPositionX: "100%" }, { backgroundPositionX: "0%", duration: 0.7, ease: "power1.inOut" }, 0.1);
        } else if (span > 0.6) {
          tl.fromTo(el + " .head", { yPercent: 40, opacity: 0 }, { yPercent: 0, opacity: 1, duration: 0.22, ease: "power2.out" }, at);
          tl.fromTo(el + " .sweep", { backgroundPositionX: "100%" }, { backgroundPositionX: "0%", duration: Math.min(0.7, span), ease: "power1.inOut" }, at + 0.06);
        } else {
          tl.set(el + " .head", { yPercent: 0, opacity: 1 }, at);
          tl.set(el + " .sweep", { backgroundPositionX: "100%" }, at);
        }
      });
      tl.set("#anchorTxt", { color: "#ffffff" }, T(12));
      tl.set("#anchorIcon", { attr: { src: "assets/icon_white.png" } }, T(12));
      tl.set("#anchorTxt", { color: "#17120d" }, T(23) - 0.25);
      tl.set("#anchorIcon", { attr: { src: "assets/icon.png" } }, T(23) - 0.25);

      // ---------- A2: assemble (b12 -> b16) ----------
      const minis = [["veste",130,820],["sneakers",650,820],["cargo",130,1130],["sacados",650,1130],["parfum",390,1440]];
      const asm = document.getElementById("asm");
      minis.forEach(([f, x, y], i) => {
        const m = document.createElement("div"); m.className = "mini"; m.id = "mini" + i;
        m.innerHTML = `<img src="assets/prod/${f}.png" alt="">`; asm.appendChild(m);
        gsap.set(m, { left: x, top: y });
      });
      tl.set("#asm", { opacity: 1, zIndex: 40 }, T(12));
      tl.fromTo("#asmT", { yPercent: 30, opacity: 0 }, { yPercent: 0, opacity: 1, duration: 0.3, ease: "power3.out" }, T(12));
      minis.forEach((_, i) => {
        // staggered cascade that resolves exactly on the b14 kick
        tl.fromTo("#mini" + i, { y: 260, scale: 0.6, opacity: 0, rotation: i % 2 ? 6 : -6 },
          { y: 0, scale: 1, opacity: 1, rotation: 0, duration: 0.42, ease: "back.out(1.4)" }, T(12.4) + i * 0.09);
      });
      tl.set("#asm", { opacity: 0 }, T(16));

      // ---------- B: statements build (b16 -> b23) ----------
      tl.set("#stm", { opacity: 1, zIndex: 41 }, T(16));
      [["#s1",16],["#s2",18],["#s3",20]].forEach(([s, b], k) => {
        tl.fromTo(s, { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.18, ease: "power3.out" }, T(b));
        if (k < 2) tl.to(s, { color: "rgba(255,255,255,0.38)", duration: 0.15 }, T(b + 2));
      });
      // the orange loafer tumbles through the three lines (one continuous arc)
      tl.fromTo("#tumble", { x: 760, y: 1260, rotation: -18, scale: 0.9 },
        { x: 300, y: 1180, rotation: 8, scale: 1, duration: T(6.6), ease: "sine.inOut" }, T(16));

      // ---------- whip pan B -> C at the b23 kick ----------
      // the outgoing scene whips left with horizontal-only blur peaking mid-whip; C lands decelerating.
      const blur = { v: 0 };
      const setBlur = () => {
        const v = blur.v.toFixed(2);
        document.getElementById("stm").style.filter = `blur(${v}px)`;
        document.getElementById("lay").style.filter = `blur(${v}px)`;
      };
      tl.fromTo("#stm", { x: 0 }, { x: -1080, duration: 0.5, ease: "power3.in" }, T(23) - 0.5);
      tl.set("#lay", { opacity: 1, zIndex: 42 }, T(23) - 0.25);
      tl.fromTo("#lay", { x: 1080 }, { x: 0, duration: 0.55, ease: "power3.out" }, T(23) - 0.25);
      tl.fromTo(blur, { v: 0 }, { v: 14, duration: 0.25, ease: "power3.in", onUpdate: setBlur }, T(23) - 0.5);
      tl.to(blur, { v: 0, duration: 0.35, ease: "power3.out", onUpdate: setBlur }, T(23) - 0.25);
      tl.set("#stm", { opacity: 0 }, T(23) + 0.3);

      // ---------- C: flat lay, calm section (b23 -> b37) ----------
      const lay = [["veste",50,280,500,520,-7],["parfum",600,300,400,400,6],["cargo",60,780,440,360,-4],["sneakers",560,780,440,330,9],["sacados",280,1000,480,280,-5]];
      const world = document.getElementById("layworld");
      lay.forEach(([f, x, y, w, h, r], i) => {
        const d = document.createElement("div"); d.className = "lay"; d.id = "lay" + i;
        d.innerHTML = `<img src="assets/prod/${f}.png" alt="">`; world.appendChild(d);
        gsap.set(d, { left: x, top: y, width: w, height: h, rotation: r });
      });
      // one slow push for the whole calm phrase (one camera move per phrase)
      tl.fromTo("#layworld", { scale: 1.0, transformOrigin: "50% 30%" }, { scale: 1.07, duration: T(14), ease: "none" }, T(23));
      tl.fromTo("#laysweep", { x: -1400 }, { x: 1400, duration: 1.8, ease: "power1.inOut" }, T(25));
      tl.fromTo("#paycard", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, T(27));
      tl.fromTo("#payA", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, T(27.2));
      tl.fromTo("#payB", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, T(29));
      tl.fromTo("#paysub", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, T(31));

      // ---------- D: drop at b37 — one white frame, logo slam, end card ----------
      tl.set("#flash", { opacity: 1 }, T(37));
      tl.set("#flash", { opacity: 0 }, T(37) + 1 / 30);
      tl.set("#end", { opacity: 1, zIndex: 43 }, T(37));
      tl.set("#lay", { opacity: 0 }, T(37) + 0.05);
      tl.set("#anchor", { opacity: 0 }, T(37));
      tl.fromTo("#icon", { scale: 1.15, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.32, ease: "expo.out" }, T(37));
      tl.fromTo("#ring", { scale: 0.7, opacity: 0.9 }, { scale: 1.5, opacity: 0, duration: 0.7, ease: "power2.out" }, T(37) + 0.05);
      tl.fromTo("#word", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, T(40));
      tl.fromTo("#tag", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, T(41));
      tl.fromTo("#count", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, T(43));
      tl.fromTo("#cta", { scale: 0.7, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.42, ease: "back.out(2)" }, T(45) - 0.06);
      tl.fromTo("#stores .bdg", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.35, stagger: 0.12, ease: "back.out(1.6)" }, T(46));

      // ---------- texture: handheld drift (bounded, seek-safe) + grain stepping ----------
      tl.fromTo("#cam", { x: 0, y: 0, rotation: 0 }, { x: 6, y: -5, rotation: 0.25, duration: 2.1, ease: "sine.inOut", yoyo: true, repeat: 9 }, 0);
      for (let f = 0; f < 21 * 12; f++) {
        // grain re-seeds 12x per second (film-like), deterministic offsets
        const ox = ((f * 137) % 512) - 256, oy = ((f * 251) % 512) - 256;
        tl.set("#grain", { x: ox / 8, y: oy / 8 }, f / 12);
      }

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
