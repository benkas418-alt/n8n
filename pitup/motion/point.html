<script>
const tl=gsap.timeline({paused:true}); const D=18.5;
// beat grid ~ 129 BPM (0.465 s)
// 0 toggle: cursor clicks, the knob (blue dot) slides, springs free
gsap.set("#dot",{x:768,y:905}); gsap.set("#cursor",{x:700,y:1300});
tl.fromTo("#toggle",{y:80,opacity:0},{y:0,opacity:1,duration:.5,ease:"back.out(1.6)"},0.1);
tl.fromTo("#toggle .lb span",{opacity:0,y:30},{opacity:1,y:0,duration:.3,stagger:.025,ease:"power2.out"},0.2);
tl.fromTo("#t0",{opacity:0,y:40},{opacity:1,y:0,duration:.5,ease:"power3.out"},0.3);
tl.fromTo("#dot",{scale:0},{scale:1,duration:.4,ease:"back.out(2)"},0.4);
tl.to("#cursor",{x:800,y:920,duration:.7,ease:"power2.inOut"},0.6);
tl.to("#cursor",{scale:.85,duration:.08,yoyo:true,repeat:1},1.32);
tl.to("#dot",{x:842,duration:.35,ease:"back.out(2.4)"},1.38);
tl.to("#sw",{backgroundColor:"#bfe0f4",duration:.2},1.38);

// the dot jumps to the search bar
tl.to(["#toggle","#t0"],{opacity:0,y:-60,duration:.4,ease:"power2.in"},2.0);
tl.fromTo("#search",{opacity:0,y:60},{opacity:1,y:0,duration:.5,ease:"back.out(1.6)"},2.1);
tl.to("#dot",{keyframes:[{x:700,y:420,duration:.3,ease:"power2.out"},{x:910,y:595,duration:.3,ease:"power2.in"}]},2.0);
tl.fromTo("#dot",{scaleX:1.3,scaleY:.75},{scaleX:1,scaleY:1,duration:.4,ease:"elastic.out(1,.4)"},2.6);
const word="sneakers"; tl.set("#search .ph",{opacity:0},2.7);
for(let i=1;i<=word.length;i++) tl.call(()=>{},null,0); 
const q={n:0}; tl.to(q,{n:word.length,duration:.9,ease:"none",onUpdate:()=>{document.getElementById("q").textContent=word.slice(0,Math.round(q.n))}},2.75);
tl.to("#dot",{scale:1.35,duration:.12,yoyo:true,repeat:1},3.7);
// results spring in, dot picks a product, drops it in the cart
for(let k=0;k<6;k++) tl.fromTo("#p"+k,{opacity:0,scale:.6,y:80},{opacity:1,scale:1,y:0,duration:.5,ease:"back.out(1.7)"},3.9+k*.08);
tl.fromTo("#t1",{opacity:0,y:40},{opacity:1,y:0,duration:.5,ease:"power3.out"},4.3);
tl.to("#dot",{keyframes:[{x:500,y:700,duration:.3,ease:"power2.out"},{x:230,y:900,duration:.3,ease:"power2.in"}]},4.6);
tl.to("#p0",{scale:1.12,duration:.3,ease:"back.out(2)"},5.2);
tl.fromTo("#cart",{opacity:0,scale:.5},{opacity:1,scale:1,duration:.4,ease:"back.out(2)"},5.3);
tl.to("#dot",{keyframes:[{x:600,y:300,duration:.4,ease:"power2.out"},{x:875,y:405,duration:.35,ease:"power2.in"}]},5.5);
tl.fromTo("#badge",{opacity:0,scale:0},{opacity:1,scale:1,duration:.4,ease:"back.out(3)"},6.25);
// route across the city
tl.to(["#search","#p0","#p1","#p2","#p3","#p4","#p5","#t1","#cart","#badge"],{opacity:0,duration:.35,ease:"power2.in"},6.9);
tl.set("#mapv",{opacity:1},7.0); tl.fromTo("#mapv",{opacity:0},{opacity:1,duration:.4},7.0);
const mp=document.getElementById("mp"), ML=mp.getTotalLength(), mo={t:0};
const cl=(v,lo,hi)=>Math.max(lo,Math.min(hi,v)); const cam=(t)=>{const p=mp.getPointAtLength(t*ML), s=1.0+0.6*Math.min(1,t*3); const tx=cl(540-p.x*s,1080-1300*s,0), ty=cl(1000-p.y*s,1920-2300*s,0); gsap.set("#mapc",{x:tx,y:ty,scale:s}); gsap.set("#dot",{x:p.x*s+tx,y:p.y*s+ty}); mp.style.strokeDashoffset=4000-t*ML;};
tl.to("#dot",{x:240,y:1650,duration:.4,ease:"power2.inOut"},6.9); tl.call(()=>cam(0),null,7.0);
tl.fromTo(mo,{t:0},{t:1,duration:5.0,ease:"power1.inOut",onUpdate:()=>cam(mo.t)},7.4);
tl.fromTo("#t2",{opacity:0,y:40},{opacity:1,y:0,duration:.5,ease:"power3.out"},8.2);
tl.to(["#mapv","#t2"],{opacity:0,duration:.3},12.6);
// dot lands, grows past every corner

tl.to("#dot",{x:540,y:960,duration:.45,ease:"power3.inOut"},12.6);
tl.set("#fill",{opacity:1},13.05); tl.set("#dot",{opacity:0},13.05);
tl.fromTo("#fill",{scale:1},{scale:65,duration:.7,ease:"expo.in"},13.05);
tl.set("#pay",{opacity:1},13.65); tl.fromTo("#pay i",{yPercent:110},{yPercent:0,duration:.6,stagger:.12,ease:"expo.out"},13.65);
tl.to("#pay",{opacity:0,duration:.3},15.5);
tl.set("#end",{opacity:1},15.7); tl.fromTo("#end > *",{opacity:0,y:50},{opacity:1,y:0,duration:.5,stagger:.12,ease:"back.out(1.6)"},15.7);
tl.set({},{},D); window.__timelines["main"]=tl; tl.seek(0);
</script></body></html>
