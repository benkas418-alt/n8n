*{box-sizing:border-box} body{margin:0}
#root{position:relative;width:1080px;height:1920px;overflow:hidden;background:radial-gradient(120% 90% at 50% 45%,#f9fbfb 0%,#f2f3f6 100%);font-family:P,sans-serif;color:#0f1419}
#cam{position:absolute;inset:0;perspective:1800px;perspective-origin:50% 30%}
#tilt{position:absolute;inset:0;transform-style:preserve-3d;transform-origin:50% 55%}
#world{position:absolute;left:0;top:0;width:900px;height:3750px;transform-style:preserve-3d;transform-origin:0 0}
#page{position:absolute;inset:0;border-radius:24px;overflow:hidden;box-shadow:0 30px 80px rgba(15,20,25,.16),0 4px 12px rgba(15,20,25,.08)}
#page img{width:900px;display:block}
.tile{position:absolute;width:210px;height:210px;border-radius:26px;background:#fff;box-shadow:0 30px 40px rgba(15,20,25,.18);display:flex;align-items:center;justify-content:center}
.tile img{width:82%;height:82%;object-fit:contain}
.logo{position:absolute;width:120px;height:120px;border-radius:28px;background:#1f88c9;display:flex;align-items:center;justify-content:center;box-shadow:0 20px 34px rgba(31,136,201,.35)}
.logo img{width:70%}
#card{position:absolute;left:90px;top:520px;width:900px;height:880px;border-radius:40px;background:#fff;box-shadow:0 40px 90px rgba(15,20,25,.18);opacity:0;display:flex;flex-direction:column;justify-content:center;padding:0 80px;gap:26px;overflow:hidden}
#card .bd{display:flex;align-items:center;gap:18px;font-weight:600;font-size:34px;color:#1f88c9} #card .bd img{width:64px}
#card h1{margin:0;font-weight:800;font-size:112px;letter-spacing:-4px;line-height:1}
#card h1 em{display:block;font-style:italic;font-weight:500;color:#1f88c9;letter-spacing:-2px}
#card .url{font-weight:600;font-size:40px;color:#5b6b78}
#stores{display:flex;gap:18px}.bdg{display:flex;align-items:center;gap:12px;background:#000;border-radius:16px;padding:10px 20px;color:#fff}.bdg svg{width:40px;height:40px}.bdg span{display:flex;flex-direction:column;line-height:1}.bdg small{font-size:16px}.bdg b{font-size:28px;font-weight:600}

<script>
const tl=gsap.timeline({paused:true}); const D=14.5, H=3750;
// close-up camera: travel shop to shop along a smooth path, then pull back, dive and land on the title card
const cp=document.getElementById("cp"), CL=cp.getTotalLength(); const C={t:0,s:2.1,bx:0,by:0,blend:0};
const cl=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));
const cam=()=>{const p=cp.getPointAtLength(C.t*CL); const px=p.x*(1-C.blend)+C.bx*C.blend, py=p.y*(1-C.blend)+C.by*C.blend, s=C.s;
  const tx=cl(540-px*s,Math.min(0,1080-900*s),Math.max(0,(1080-900*s)/2)), ty0=960-py*s, ty=3750*s>1920?cl(ty0,1920-3750*s,0):ty0; gsap.set("#world",{x:tx,y:ty,scale:s});};
gsap.set("#tilt",{rotationX:14}); cam();
tl.to(C,{t:1,duration:7.9,ease:"sine.inOut",onUpdate:cam},0);
tl.to(C,{s:2.35,duration:1.2,ease:"sine.inOut",yoyo:true,repeat:5,onUpdate:cam},0.2);
tl.to(C,{blend:1,bx:450,by:1800,s:0.44,duration:1.6,ease:"power2.inOut",onUpdate:cam},7.75);
tl.to("#tilt",{rotationX:28,duration:1.6,ease:"power2.inOut"},7.75);
tl.to(C,{by:250,s:1.6,duration:0.5,ease:"power3.in",onUpdate:cam},9.47);
tl.to("#tilt",{rotationX:0,duration:0.5,ease:"power3.in"},9.47);
tl.to("#cam",{opacity:0,duration:0.25},9.8);
tl.fromTo("#card",{opacity:0,scale:1.25,rotationX:20},{opacity:1,scale:1,rotationX:0,duration:0.6,ease:"expo.out"},9.97);
tl.fromTo("#card > *",{opacity:0,y:40},{opacity:1,y:0,duration:0.5,stagger:0.15,ease:"power3.out"},10.1);
tl.fromTo(".tile",{y:0},{y:-18,duration:1.6,ease:"sine.inOut",yoyo:true,repeat:5,stagger:0.25},0);
tl.set({},{},D); window.__timelines["main"]=tl; tl.seek(0);
