<script>
const tl=gsap.timeline({paused:true}); const D=18.0, E=0.2239;
const type=(id,txt,at,dur)=>{const o={n:0};tl.fromTo(o,{n:0},{n:txt.length,duration:dur,ease:"none",onUpdate:()=>{document.getElementById(id).textContent=txt.slice(0,Math.round(o.n))}},at);};
// camera keeps drifting 1.0 -> 1.04 per scene, never snapping back
[[0,3.2],[3.2,6],[6,10],[10,12.5],[12.5,14.5],[14.5,18]].forEach(([a,b],k)=>tl.fromTo("#cam",{scale:1+0.0},{scale:1.04,duration:b-a,ease:"none",immediateRender:false},a));

tl.fromTo("#bar",{opacity:0,y:40},{opacity:1,y:0,duration:.4,ease:"power3.out"},6.0); type("bq","robe en jean…",6.2,0.8);
tl.fromTo("#rc",{opacity:0,scale:.9},{opacity:1,scale:1,duration:.4,ease:"back.out(1.6)"},6.3); tl.fromTo("#chip",{opacity:0},{opacity:1,duration:.3},6.3);

for(let i=0;i<16;i++){const t=6.5+i*E, k=i%8; tl.set("#r"+k,{opacity:1},t); tl.set("#r"+k,{opacity:0},t+E); tl.call(()=>{document.getElementById("chipt").textContent=CH[k]},null,t); tl.fromTo("#chipt",{yPercent:100},{yPercent:0,duration:.15,ease:"power2.out",immediateRender:false},t);}
tl.to(["#bar","#chip","#rc"],{opacity:0,duration:.3},9.8);
// 4 nine images fly into a 3x3 grid
for(let k=0;k<9;k++){const gx=60+(k%3)*330, gy=420+Math.floor(k/3)*330; gsap.set("#g"+k,{left:gx,top:gy}); tl.fromTo("#g"+k,{opacity:0,x:(k%3-1)*500,y:-700+k*40,rotation:(k%2?12:-12)},{opacity:1,x:0,y:0,rotation:0,duration:.6,ease:"power3.out"},10.0+k*.06);}
type("got","Tout est là.",10.8,0.6); tl.set("#got",{opacity:1},10.8);
tl.to([".gc","#got"],{opacity:0,duration:.3},12.3);
// 5 two lines, the emphasized word in the brand gradient
tl.set("#two",{opacity:1},12.5); tl.fromTo("#l1",{opacity:0,y:30},{opacity:1,y:0,duration:.35},12.55); tl.fromTo("#l2",{opacity:0,y:30},{opacity:1,y:0,duration:.35},13.2);
tl.to("#two",{opacity:0,duration:.3},14.3);
// 6 burst of images behind a glass pill, then they gather into the logo
for(let k=0;k<60;k++){const a=k*2.399, r=380+((k*53)%420); tl.fromTo("#b"+k,{opacity:0,x:0,y:0,scale:.3},{opacity:1,x:Math.cos(a)*r,y:Math.sin(a)*r*1.4,scale:1,rotation:(k%2?1:-1)*30,duration:.9,ease:"expo.out"},14.5+k*.004); tl.to("#b"+k,{x:0,y:-180,scale:.2,opacity:0,duration:.6,ease:"power3.in"},16.0);}
